<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E63D6"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#B45309"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="476" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Как режет инструмент: режущий клин и элементы резания</text>

  <!-- панель A -->
  <rect x="25" y="58" width="400" height="410" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="45" y="84" font-size="14" font-weight="700" fill="#1E293B">Режущий клин (сечение)</text>
  <rect x="50" y="260" width="350" height="130" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <rect x="220" y="240" width="180" height="20" fill="#FCD34D" stroke="#B45309" stroke-width="1"/>
  <text x="330" y="330" text-anchor="middle" font-size="13" fill="#92400E">заготовка</text>
  <text x="398" y="234" text-anchor="end" font-size="11" fill="#92400E">срезаемый слой</text>
  <!-- стружка -->
  <path d="M224,244 C236,200 252,162 300,140 L312,162 C272,180 258,214 248,250 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
  <text x="318" y="150" font-size="13" font-weight="700" fill="#B45309">стружка</text>
  <!-- резец -->
  <polygon points="220,260 200,110 80,110 80,244" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <text x="130" y="170" font-size="14" font-weight="700" fill="#1E293B">резец</text>
  <!-- линии для углов -->
  <line x1="220" y1="260" x2="220" y2="120" stroke="#64748B" stroke-dasharray="4 4"/>
  <line x1="220" y1="260" x2="60" y2="260" stroke="#64748B" stroke-dasharray="4 4"/>
  <line x1="220" y1="260" x2="250" y2="240" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M220,170 A90 90 0 0 0 210,170.6" fill="none" stroke="#15803D" stroke-width="2.5"/>
  <text x="200" y="160" font-size="16" font-weight="700" fill="#15803D">γ</text>
  <path d="M140,260 A80 80 0 0 1 140.6,250" fill="none" stroke="#1E63D6" stroke-width="2.5"/>
  <text x="120" y="256" font-size="16" font-weight="700" fill="#1E63D6">α</text>
  <text x="178" y="230" font-size="16" font-weight="700" fill="#7C3AED">β</text>
  <text x="258" y="272" font-size="10" fill="#DC2626">зона сдвига</text>
  <line x1="400" y1="410" x2="300" y2="410" stroke="#1E63D6" stroke-width="3" marker-end="url(#ab)"/>
  <text x="45" y="414" font-size="12" fill="#1E63D6">деталь движется навстречу резцу — Vc</text>
  <g font-size="12" fill="#1E293B">
    <text x="45" y="445"><tspan font-weight="700" fill="#15803D">γ</tspan> передний — облегчает сход стружки</text>
    <text x="45" y="460"><tspan font-weight="700" fill="#1E63D6">α</tspan> задний — нет трения об деталь   <tspan font-weight="700" fill="#7C3AED">β</tspan> — прочность</text>
  </g>

  <!-- панель B -->
  <rect x="435" y="58" width="400" height="410" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="455" y="84" font-size="14" font-weight="700" fill="#1E293B">Точение: вид сверху</text>
  <polygon points="460,150 620,150 620,180 790,180 790,320 460,320" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <line x1="450" y1="320" x2="810" y2="320" stroke="#1E293B" stroke-dasharray="14 4 3 4"/>
  <text x="520" y="270" font-size="12" fill="#92400E">ещё не обработано</text>
  <text x="680" y="270" font-size="12" fill="#92400E">обработано</text>
  <!-- резец -->
  <rect x="650" y="62" width="60" height="62" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/>
  <polygon points="622,178 612,128 660,108 700,165" fill="#475569" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="622" cy="178" r="3.5" fill="#F59E0B"/>
  <!-- угол в плане -->
  <line x1="622" y1="178" x2="560" y2="178" stroke="#64748B" stroke-dasharray="4 4"/>
  <path d="M592,178 A30 30 0 0 1 616,148.6" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <text x="578" y="160" font-size="15" font-weight="700" fill="#DC2626">κr</text>
  <!-- ap -->
  <line x1="600" y1="150" x2="600" y2="180" stroke="#B45309" stroke-width="1.5" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="560" y="132" font-size="13" font-weight="700" fill="#B45309">ap</text>
  <line x1="573" y1="136" x2="597" y2="160" stroke="#B45309"/>
  <!-- подача -->
  <line x1="640" y1="205" x2="585" y2="205" stroke="#1E63D6" stroke-width="3" marker-end="url(#ab)"/>
  <text x="645" y="210" font-size="12" font-weight="700" fill="#1E63D6">подача f, мм/об</text>
  <text x="630" y="196" font-size="11" fill="#B45309">r — радиус при вершине</text>
  <path d="M470,190 A14 40 0 1 0 470,290" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ap)"/>
  <text x="488" y="205" font-size="11" fill="#7C3AED">вращение (Vc)</text>
  <g font-size="12" fill="#1E293B">
    <text x="455" y="350"><tspan font-weight="700" fill="#B45309">ap</tspan> — глубина резания (на сторону), мм</text>
    <text x="455" y="370"><tspan font-weight="700" fill="#1E63D6">f</tspan> — подача за оборот детали, мм/об</text>
    <text x="455" y="390"><tspan font-weight="700" fill="#7C3AED">Vc</tspan> — скорость резания, м/мин</text>
    <text x="455" y="410"><tspan font-weight="700" fill="#DC2626">κr</tspan> — главный угол в плане:</text>
    <text x="470" y="428">90–95° — можно точить к уступу,</text>
    <text x="470" y="446">45–75° — прочнее кромка, тоньше стружка</text>
  </g>
</svg>
