<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E63D6"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="496" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Основные токарные резцы и где они работают</text>
  <rect x="25" y="58" width="810" height="360" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>

  <!-- патрон -->
  <rect x="60" y="130" width="60" height="220" fill="#475569"/>
  <!-- деталь -->
  <path d="M120,150 L240,150 L240,150 L640,150 L640,330 L340,330 L340,318 L320,318 L320,330 L208,330 L208,272 L192,272 L192,330 L120,330 Z" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <polyline points="240,150 248,140 256,150 264,140 272,150 280,140 288,150 296,140 304,150 312,140 320,150" fill="none" stroke="#B45309" stroke-width="1.5"/>
  <line x1="100" y1="240" x2="760" y2="240" stroke="#1E293B" stroke-dasharray="14 4 3 4"/>
  <!-- отверстие -->
  <line x1="540" y1="212" x2="640" y2="212" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="540" y1="268" x2="640" y2="268" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="540" y1="212" x2="540" y2="268" stroke="#B45309" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 1 проходной -->
  <rect x="438" y="70" width="34" height="64" fill="#94A3B8" stroke="#334155"/>
  <polygon points="452,150 444,132 470,126 476,140" fill="#475569"/>
  <line x1="430" y1="160" x2="395" y2="160" stroke="#1E63D6" stroke-width="2.5" marker-end="url(#ab)"/>
  <!-- 2 подрезной -->
  <rect x="660" y="80" width="34" height="64" fill="#94A3B8" stroke="#334155" transform="rotate(20 677 112)"/>
  <polygon points="642,168 650,146 668,150 660,170" fill="#475569"/>
  <line x1="652" y1="182" x2="652" y2="216" stroke="#1E63D6" stroke-width="2.5" marker-end="url(#ab)"/>
  <!-- 3 резьбовой -->
  <rect x="263" y="70" width="34" height="58" fill="#94A3B8" stroke="#334155"/>
  <polygon points="272,128 288,128 280,141" fill="#475569"/>
  <!-- 4 канавочный -->
  <rect x="318" y="345" width="24" height="60" fill="#94A3B8" stroke="#334155"/>
  <rect x="322" y="320" width="16" height="26" fill="#475569"/>
  <!-- 5 отрезной -->
  <rect x="188" y="345" width="24" height="60" fill="#94A3B8" stroke="#334155"/>
  <rect x="194" y="274" width="12" height="72" fill="#475569"/>
  <!-- 6 расточной -->
  <rect x="580" y="232" width="200" height="18" rx="3" fill="#94A3B8" stroke="#334155"/>
  <polygon points="568,214 588,214 590,232 572,232" fill="#475569"/>

  <!-- номера -->
  <g font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">
    <circle cx="500" cy="100" r="13" fill="#F59E0B"/><text x="500" y="105">1</text>
    <circle cx="730" cy="95" r="13" fill="#F59E0B"/><text x="730" y="100">2</text>
    <circle cx="240" cy="95" r="13" fill="#F59E0B"/><text x="240" y="100">3</text>
    <circle cx="370" cy="380" r="13" fill="#F59E0B"/><text x="370" y="385">4</text>
    <circle cx="160" cy="380" r="13" fill="#F59E0B"/><text x="160" y="385">5</text>
    <circle cx="800" cy="241" r="13" fill="#F59E0B"/><text x="800" y="246">6</text>
  </g>
  <text x="70" y="122" font-size="11" fill="#475569">патрон</text>

  <rect x="25" y="428" width="810" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <g font-size="13" fill="#1E293B">
    <text x="40" y="452"><tspan font-weight="700" fill="#B45309">1</tspan> Проходной — наружные диаметры, конусы</text>
    <text x="330" y="452"><tspan font-weight="700" fill="#B45309">2</tspan> Подрезной — торцы</text>
    <text x="560" y="452"><tspan font-weight="700" fill="#B45309">3</tspan> Резьбовой — резьба</text>
    <text x="40" y="476"><tspan font-weight="700" fill="#B45309">4</tspan> Канавочный — канавки</text>
    <text x="330" y="476"><tspan font-weight="700" fill="#B45309">5</tspan> Отрезной — отрезка детали</text>
    <text x="560" y="476"><tspan font-weight="700" fill="#B45309">6</tspan> Расточной — отверстия изнутри</text>
  </g>
</svg>
