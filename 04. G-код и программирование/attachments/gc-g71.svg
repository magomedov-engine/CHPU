<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E63D6"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#B45309"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="446" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Цикл G71: черновая обработка по контуру</text>

  <rect x="25" y="58" width="810" height="300" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <!-- заготовка и деталь -->
  <rect x="150" y="120" width="560" height="210" fill="#FDE68A" stroke="#B45309" stroke-dasharray="5 4"/>
  <polygon points="700,330 700,270 520,270 520,220 340,220 340,160 150,160 150,330" fill="#BFDBFE" stroke="#1E293B" stroke-width="2.5"/>
  <line x1="130" y1="330" x2="740" y2="330" stroke="#1E293B" stroke-dasharray="14 4 3 4"/>
  <!-- припуск -->
  <polyline points="720,264 526,264 526,214 346,214 346,154 150,154" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="5 4"/>
  <!-- проходы -->
  <g stroke="#1E63D6" stroke-width="2.2">
    <line x1="720" y1="135" x2="156" y2="135" marker-end="url(#ab)"/>
    <line x1="720" y1="155" x2="352" y2="155" marker-end="url(#ab)"/>
    <line x1="720" y1="175" x2="352" y2="175" marker-end="url(#ab)"/>
    <line x1="720" y1="195" x2="352" y2="195" marker-end="url(#ab)"/>
    <line x1="720" y1="215" x2="532" y2="215" marker-end="url(#ab)"/>
    <line x1="720" y1="235" x2="532" y2="235" marker-end="url(#ab)"/>
    <line x1="720" y1="255" x2="532" y2="255" marker-end="url(#ab)"/>
  </g>
  <!-- точка старта -->
  <circle cx="730" cy="112" r="7" fill="#DC2626"/>
  <text x="742" y="108" font-size="12" font-weight="700" fill="#DC2626">старт цикла</text>
  <text x="742" y="123" font-size="11" fill="#DC2626">X48. Z2.</text>
  <!-- размеры -->
  <line x1="745" y1="155" x2="745" y2="175" stroke="#B45309" stroke-width="1.2" marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="752" y="162" font-size="12" font-weight="700" fill="#B45309">U (Δd) —</text>
  <text x="752" y="177" font-size="11" fill="#B45309">съём на</text><text x="752" y="191" font-size="11" fill="#B45309">сторону</text>
  <text x="352" y="150" font-size="11" fill="#7C3AED"></text>
  <text x="160" y="350" font-size="11" fill="#7C3AED">фиолетовый пунктир — припуск на чистовую (U Δu, W Δw)</text>
  <text x="230" y="300" font-size="13" fill="#1E293B">деталь (контур N120…N220)</text>
  <text x="560" y="300" font-size="12" fill="#1E293B">← P120 … Q220</text>
  <text x="45" y="84" font-size="13" font-weight="700" fill="#1E293B">Стойка сама режет заготовку слоями до контура, оставляя припуск, — вы описываете только чистовой контур.</text>

  <rect x="25" y="368" width="810" height="70" rx="10" fill="#0F172A"/>
  <g font-family="Consolas, monospace" font-size="14">
    <text x="45" y="395"><tspan fill="#60A5FA">G71 </tspan><tspan fill="#FBBF24">U2. R0.5</tspan><tspan fill="#64748B">                (съём 2 мм на сторону, отвод 0,5)</tspan></text>
    <text x="45" y="420"><tspan fill="#60A5FA">G71 </tspan><tspan fill="#FBBF24">P120 Q220 U0.4 W0.1 F0.25</tspan><tspan fill="#64748B">  (контур, припуск Ø0,4 / Z0,1)</tspan></text>
  </g>
</svg>
