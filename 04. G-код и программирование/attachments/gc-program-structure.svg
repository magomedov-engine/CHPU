<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="856" height="556" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Из чего состоит управляющая программа</text>

  <rect x="25" y="58" width="440" height="430" rx="10" fill="#0F172A"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text x="45" y="92" fill="#94A3B8">%</text>
    <text x="45" y="122"><tspan fill="#FBBF24">O1001</tspan><tspan fill="#64748B"> (PLATE OP10)</tspan></text>
    <text x="45" y="152"><tspan fill="#64748B">N10 </tspan><tspan fill="#60A5FA">G17 G21 G40 G49 G80 G90</tspan></text>
    <text x="45" y="182"><tspan fill="#64748B">N20 </tspan><tspan fill="#2DD4BF">T01 </tspan><tspan fill="#C084FC">M06</tspan><tspan fill="#64748B"> (SPOT D10)</tspan></text>
    <text x="45" y="212"><tspan fill="#64748B">N30 </tspan><tspan fill="#60A5FA">G54 G00 </tspan><tspan fill="#F87171">X10. </tspan><tspan fill="#4ADE80">Y10.</tspan></text>
    <text x="45" y="242"><tspan fill="#64748B">N40 </tspan><tspan fill="#FB923C">S2500 </tspan><tspan fill="#C084FC">M03</tspan></text>
    <text x="45" y="272"><tspan fill="#64748B">N50 </tspan><tspan fill="#60A5FA">G43 </tspan><tspan fill="#2DD4BF">H01 </tspan><tspan fill="#93C5FD">Z50. </tspan><tspan fill="#C084FC">M08</tspan></text>
    <text x="45" y="302"><tspan fill="#64748B">N60 </tspan><tspan fill="#60A5FA">G01 </tspan><tspan fill="#93C5FD">Z-2. </tspan><tspan fill="#FB923C">F150</tspan></text>
    <text x="45" y="332"><tspan fill="#64748B">N70 </tspan><tspan fill="#F87171">X90.</tspan></text>
    <text x="45" y="362" fill="#64748B">...</text>
    <text x="45" y="392"><tspan fill="#64748B">N200 </tspan><tspan fill="#60A5FA">G00 </tspan><tspan fill="#93C5FD">Z50. </tspan><tspan fill="#C084FC">M09</tspan></text>
    <text x="45" y="422"><tspan fill="#64748B">N210 </tspan><tspan fill="#C084FC">M30</tspan></text>
    <text x="45" y="452" fill="#94A3B8">%</text>
  </g>

  <g font-size="13" fill="#1E293B">
    <line x1="470" y1="87" x2="485" y2="87" stroke="#94A3B8"/><text x="490" y="92">начало и конец файла</text>
    <line x1="470" y1="117" x2="485" y2="117" stroke="#FBBF24"/><text x="490" y="122"><tspan font-weight="700">номер программы</tspan> + комментарий в ( )</text>
    <line x1="470" y1="147" x2="485" y2="147" stroke="#60A5FA"/><text x="490" y="152"><tspan font-weight="700">строка безопасности</tspan> — сброс режимов</text>
    <line x1="470" y1="177" x2="485" y2="177" stroke="#2DD4BF"/><text x="490" y="182">выбрать инструмент 1 и <tspan font-weight="700">сменить</tspan></text>
    <line x1="470" y1="207" x2="485" y2="207" stroke="#F87171"/><text x="490" y="212">нуль детали G54, <tspan font-weight="700">ускоренно</tspan> в X10 Y10</text>
    <line x1="470" y1="237" x2="485" y2="237" stroke="#FB923C"/><text x="490" y="242">шпиндель 2500 об/мин <tspan font-weight="700">по часовой</tspan></text>
    <line x1="470" y1="267" x2="485" y2="267" stroke="#2DD4BF"/><text x="490" y="272">учесть <tspan font-weight="700">длину</tspan> инструмента, Z50, вкл. СОЖ</text>
    <line x1="470" y1="297" x2="485" y2="297" stroke="#93C5FD"/><text x="490" y="302"><tspan font-weight="700">рабочая подача</tspan> 150 мм/мин до Z−2</text>
    <line x1="470" y1="327" x2="485" y2="327" stroke="#F87171"/><text x="490" y="332">G01 и F действуют дальше — <tspan font-weight="700">модальность</tspan></text>
    <line x1="470" y1="387" x2="485" y2="387" stroke="#93C5FD"/><text x="490" y="392">отвод вверх, выкл. СОЖ</text>
    <line x1="470" y1="417" x2="485" y2="417" stroke="#C084FC"/><text x="490" y="422"><tspan font-weight="700">конец программы</tspan>, возврат в начало</text>
  </g>

  <rect x="25" y="498" width="810" height="48" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <g font-size="12" font-weight="700">
    <text x="40" y="527" fill="#64748B">N — номер кадра</text>
    <text x="160" y="527" fill="#2563EB">G — подготовительные</text>
    <text x="320" y="527" fill="#9333EA">M — вспомогательные</text>
    <text x="475" y="527" fill="#DC2626">X Y Z — координаты</text>
    <text x="620" y="527" fill="#EA580C">F S — подача, обороты</text>
    <text x="775" y="527" fill="#0D9488">T H D</text>
  </g>
</svg>
