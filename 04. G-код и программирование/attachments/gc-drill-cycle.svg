<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="h" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#FEF3C7"/><line x1="0" y1="0" x2="0" y2="9" stroke="#B45309" stroke-width="1"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E63D6"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="466" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Цикл сверления: начальная плоскость, плоскость R, глубина Z</text>

  <!-- панель 1 -->
  <rect x="25" y="58" width="400" height="400" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="45" y="84" font-size="14" font-weight="700" fill="#1E293B">G81 — простое сверление</text>
  <rect x="45" y="250" width="360" height="160" fill="url(#h)" stroke="#B45309" stroke-width="1.5"/>
  <rect x="150" y="250" width="20" height="110" fill="#FFFFFF" stroke="#B45309"/>
  <polygon points="150,360 170,360 160,372" fill="#FFFFFF" stroke="#B45309"/>
  <rect x="270" y="250" width="20" height="110" fill="#FFFFFF" stroke="#B45309"/>
  <polygon points="270,360 290,360 280,372" fill="#FFFFFF" stroke="#B45309"/>
  <g stroke="#64748B" stroke-dasharray="6 4"><line x1="45" y1="120" x2="405" y2="120"/><line x1="45" y1="225" x2="405" y2="225"/></g>
  <text x="50" y="114" font-size="12" font-weight="700" fill="#475569">начальная плоскость (Z50)</text>
  <text x="50" y="219" font-size="12" font-weight="700" fill="#475569">плоскость R (R3.)</text>
  <text x="335" y="245" font-size="12" fill="#92400E">Z0 — верх</text>
  <!-- отверстие 1, G99 -->
  <line x1="160" y1="122" x2="160" y2="222" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <line x1="160" y1="228" x2="160" y2="368" stroke="#1E63D6" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="166" y1="366" x2="166" y2="230" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <line x1="170" y1="225" x2="266" y2="225" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <text x="178" y="300" font-size="11" fill="#1E63D6">подача F</text>
  <text x="178" y="312" font-size="11" fill="#1E63D6">до Z-20.</text>
  <!-- отверстие 2, G98 -->
  <line x1="280" y1="228" x2="280" y2="368" stroke="#1E63D6" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="286" y1="366" x2="286" y2="126" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#ar)"/>
  <text x="105" y="200" font-size="11" fill="#DC2626">G99: отвод до R</text>
  <text x="295" y="160" font-size="11" fill="#DC2626">G98: отвод до</text>
  <text x="295" y="173" font-size="11" fill="#DC2626">начальной</text>
  <g font-family="Consolas, monospace" font-size="12">
    <text x="45" y="432" fill="#1E293B">G99 G81 X20. Y10. Z-20. R3. F150</text>
    <text x="45" y="449" fill="#1E293B">G98 X40.   (следующее отверстие)   ... G80</text>
  </g>

  <!-- панель 2 -->
  <rect x="435" y="58" width="400" height="400" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="455" y="84" font-size="14" font-weight="700" fill="#1E293B">G83 — глубокое сверление с выводом</text>
  <rect x="455" y="250" width="360" height="160" fill="url(#h)" stroke="#B45309" stroke-width="1.5"/>
  <rect x="580" y="250" width="20" height="140" fill="#FFFFFF" stroke="#B45309"/>
  <polygon points="580,390 600,390 590,402" fill="#FFFFFF" stroke="#B45309"/>
  <line x1="455" y1="225" x2="815" y2="225" stroke="#64748B" stroke-dasharray="6 4"/>
  <text x="460" y="219" font-size="12" font-weight="700" fill="#475569">плоскость R</text>
  <!-- клевки -->
  <g stroke-width="2.5">
    <line x1="560" y1="228" x2="560" y2="282" stroke="#1E63D6" marker-end="url(#ab)"/>
    <line x1="566" y1="280" x2="566" y2="230" stroke="#DC2626" stroke-dasharray="6 4" marker-end="url(#ar)"/>
    <line x1="620" y1="232" x2="620" y2="276" stroke="#DC2626" stroke-dasharray="6 4" marker-end="url(#ar)"/>
    <line x1="620" y1="282" x2="620" y2="336" stroke="#1E63D6" marker-end="url(#ab)"/>
    <line x1="626" y1="334" x2="626" y2="230" stroke="#DC2626" stroke-dasharray="6 4" marker-end="url(#ar)"/>
    <line x1="680" y1="232" x2="680" y2="330" stroke="#DC2626" stroke-dasharray="6 4" marker-end="url(#ar)"/>
    <line x1="680" y1="336" x2="680" y2="398" stroke="#1E63D6" marker-end="url(#ab)"/>
    <line x1="686" y1="396" x2="686" y2="230" stroke="#DC2626" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  </g>
  <text x="525" y="300" font-size="11" fill="#1E63D6">Q</text>
  <text x="602" y="315" font-size="11" fill="#1E63D6">Q</text>
  <text x="662" y="370" font-size="11" fill="#1E63D6">до Z</text>
  <text x="714" y="300" font-size="11" fill="#475569">после каждого клевка —</text>
  <text x="714" y="314" font-size="11" fill="#475569">выход до R (стружка</text>
  <text x="714" y="328" font-size="11" fill="#475569">удаляется), затем</text>
  <text x="714" y="342" font-size="11" fill="#475569">быстро обратно</text>
  <g font-family="Consolas, monospace" font-size="12">
    <text x="455" y="432" fill="#1E293B">G83 X50. Y30. Z-25. R3. Q5. F120</text>
    <text x="455" y="449" fill="#475569">Q5. — глубина одного клевка 5 мм</text>
  </g>
</svg>
