<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E63D6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#E2E8F0" stroke-width="1"/></pattern>
  </defs>
  <rect x="2" y="2" width="856" height="466" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Основные перемещения: G00, G01, G02, G03</text>

  <!-- панель 1 -->
  <rect x="25" y="58" width="400" height="395" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="45" y="84" font-size="14" font-weight="700" fill="#1E293B">G00 — ускоренно, G01 — по прямой с подачей</text>
  <rect x="70" y="116" width="336" height="264" fill="url(#grid)"/>
  <line x1="70" y1="380" x2="410" y2="380" stroke="#64748B" stroke-width="1.5"/>
  <line x1="70" y1="380" x2="70" y2="110" stroke="#64748B" stroke-width="1.5"/>
  <text x="405" y="398" font-size="12" font-weight="700" fill="#E53935">X</text>
  <text x="56" y="118" font-size="12" font-weight="700" fill="#2E7D32">Y</text>
  <polyline points="110,340 270,180 382,180" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ar)"/>
  <line x1="110" y1="340" x2="384" y2="184" stroke="#1E63D6" stroke-width="3" marker-end="url(#ab)"/>
  <circle cx="110" cy="340" r="6" fill="#1E293B"/><circle cx="390" cy="180" r="6" fill="#1E293B"/>
  <text x="90" y="362" font-size="13" font-weight="700" fill="#1E293B">A (10; 10)</text>
  <text x="330" y="165" font-size="13" font-weight="700" fill="#1E293B">B (80; 50)</text>
  <text x="160" y="235" font-size="12" fill="#DC2626" transform="rotate(-45 160 235)">G00 — «ломаная»</text>
  <text x="255" y="288" font-size="12" fill="#1E63D6" transform="rotate(-29 255 288)">G01 — точно по прямой</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="45" y="415" fill="#DC2626">G00 X80. Y50.        (быстро, НЕ резать!)</text>
    <text x="45" y="437" fill="#1E63D6">G01 X80. Y50. F200   (резать, 200 мм/мин)</text>
  </g>

  <!-- панель 2 -->
  <rect x="435" y="58" width="400" height="395" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="455" y="84" font-size="14" font-weight="700" fill="#1E293B">G02 — по часовой, G03 — против (вид с +Z)</text>
  <rect x="480" y="116" width="336" height="264" fill="url(#grid)"/>
  <line x1="480" y1="380" x2="820" y2="380" stroke="#64748B" stroke-width="1.5"/>
  <line x1="480" y1="380" x2="480" y2="110" stroke="#64748B" stroke-width="1.5"/>
  <text x="815" y="398" font-size="12" font-weight="700" fill="#E53935">X</text>
  <text x="466" y="118" font-size="12" font-weight="700" fill="#2E7D32">Y</text>
  <path d="M600,260 A120 120 0 1 0 720,140" fill="none" stroke="#15803D" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ag)"/>
  <path d="M600,260 A120 120 0 0 1 716,140.1" fill="none" stroke="#1E63D6" stroke-width="3.5" marker-end="url(#ab)"/>
  <line x1="600" y1="260" x2="714" y2="260" stroke="#B45309" stroke-width="2" marker-end="url(#ao)"/>
  <circle cx="600" cy="260" r="6" fill="#1E293B"/><circle cx="720" cy="140" r="6" fill="#1E293B"/>
  <circle cx="720" cy="260" r="4" fill="#B45309"/>
  <text x="530" y="255" font-size="13" font-weight="700" fill="#1E293B">S (20; 20)</text>
  <text x="730" y="132" font-size="13" font-weight="700" fill="#1E293B">E (40; 40)</text>
  <text x="726" y="276" font-size="12" fill="#B45309">центр (40; 20)</text>
  <text x="620" y="282" font-size="12" font-weight="700" fill="#B45309">I20 J0</text>
  <text x="560" y="165" font-size="12" font-weight="700" fill="#1E63D6">G02</text>
  <text x="800" y="315" font-size="12" font-weight="700" fill="#15803D">G03</text>
  <g font-family="Consolas, monospace" font-size="13">
    <text x="455" y="415" fill="#1E63D6">G02 X40. Y40. R20.   (или I20. J0)</text>
    <text x="455" y="437" fill="#15803D">G03 X40. Y40. R-20.  (дуга &gt; 180°)</text>
  </g>
</svg>
