<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E63D6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker>
    <marker id="xr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E53935"/></marker>
    <marker id="yg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="466" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Пример фрезерной программы: плита ПЛ.002 — точки и траектории</text>

  <rect x="25" y="58" width="500" height="400" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <!-- плита -->
  <rect x="100" y="160" width="400" height="240" fill="#E0E7FF" fill-opacity="0.5" stroke="#1E293B" stroke-width="2"/>
  <!-- отверстия -->
  <g fill="#FFFFFF" stroke="#1E293B" stroke-width="2">
    <circle cx="140" cy="360" r="18"/><circle cx="460" cy="360" r="18"/><circle cx="140" cy="200" r="18"/><circle cx="460" cy="200" r="18"/>
    <circle cx="300" cy="360" r="10"/><circle cx="300" cy="200" r="10"/>
  </g>
  <!-- карман: контур программы -->
  <rect x="220" y="240" width="160" height="80" rx="20" fill="#FFFFFF" stroke="#1E63D6" stroke-width="3"/>
  <!-- путь центра фрезы -->
  <rect x="236" y="256" width="128" height="48" rx="4" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- рампа -->
  <line x1="252" y1="280" x2="346" y2="280" stroke="#15803D" stroke-width="2.5" marker-end="url(#ag)"/>
  <!-- подвод -->
  <line x1="300" y1="282" x2="300" y2="316" stroke="#1E63D6" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="300" y1="320" x2="348" y2="320" stroke="#1E63D6" stroke-width="3" marker-end="url(#ab)"/>

  <!-- G54 -->
  <line x1="100" y1="400" x2="160" y2="400" stroke="#E53935" stroke-width="3" marker-end="url(#xr)"/>
  <line x1="100" y1="400" x2="100" y2="340" stroke="#2E7D32" stroke-width="3" marker-end="url(#yg)"/>
  <circle cx="100" cy="400" r="6" fill="#1E293B"/>
  <text x="60" y="425" font-size="12" font-weight="700" fill="#1E293B">G54: X0 Y0, Z0 — верх</text>
  <text x="165" y="417" font-size="12" font-weight="700" fill="#E53935">X</text>
  <text x="84" y="345" font-size="12" font-weight="700" fill="#2E7D32">Y</text>

  <!-- подписи точек -->
  <g font-size="11" font-weight="700" fill="#1E293B">
    <text x="112" y="390">1 (10;10)</text><text x="432" y="390">2 (90;10)</text>
    <text x="112" y="232">3 (10;50)</text><text x="432" y="232">4 (90;50)</text>
    <text x="272" y="390">5 (50;10)</text><text x="272" y="182">6 (50;50)</text>
  </g>
  <text x="306" y="336" font-size="11" fill="#1E63D6">(50;20)</text>
  <text x="230" y="276" font-size="11" fill="#15803D">(38;30)</text>
  <text x="352" y="276" font-size="11" fill="#15803D">(62;30)</text>
  <text x="384" y="252" font-size="11" fill="#1E63D6">R5</text>
  <text x="225" y="236" font-size="11" fill="#1E293B">(30;40)</text>
  <text x="352" y="336" font-size="11" fill="#1E293B">(70;20)</text>
  <text x="45" y="84" font-size="13" font-weight="700" fill="#1E293B">Вид сверху (масштаб: 1 мм = 4 px)</text>

  <!-- легенда -->
  <rect x="540" y="58" width="295" height="400" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="556" y="84" font-size="14" font-weight="700" fill="#1E293B">Переходы</text>
  <g font-size="12" fill="#1E293B">
    <text x="556" y="110"><tspan font-weight="700">T1</tspan> центровка Ø10 — точки 1…6</text>
    <text x="556" y="132"><tspan font-weight="700">T2</tspan> сверло Ø9 — точки 1…4 (G83)</text>
    <text x="556" y="154"><tspan font-weight="700">T3</tspan> сверло Ø5 — точки 5, 6 (G83)</text>
    <text x="556" y="176"><tspan font-weight="700">T4</tspan> метчик M6 — точки 5, 6 (G84)</text>
    <text x="556" y="198"><tspan font-weight="700">T5</tspan> фреза Ø8 — карман</text>
  </g>
  <line x1="556" y1="215" x2="820" y2="215" stroke="#E2E8F0"/>
  <line x1="556" y1="238" x2="596" y2="238" stroke="#1E63D6" stroke-width="3"/>
  <text x="604" y="242" font-size="12" fill="#1E293B">контур кармана в программе</text>
  <line x1="556" y1="262" x2="596" y2="262" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="604" y="266" font-size="12" fill="#1E293B">путь центра фрезы (G41 D5)</text>
  <line x1="556" y1="286" x2="596" y2="286" stroke="#15803D" stroke-width="2.5"/>
  <text x="604" y="290" font-size="12" fill="#1E293B">врезание «рампой» по X</text>
  <text x="556" y="322" font-size="12" fill="#475569">Карман: X30…70, Y20…40, R5,</text>
  <text x="556" y="339" font-size="12" fill="#475569">глубина 5. Обход против часовой</text>
  <text x="556" y="356" font-size="12" fill="#475569">+ G41 = попутное фрезерование.</text>
  <text x="556" y="388" font-size="12" fill="#475569">Заготовка уже фрезерована</text>
  <text x="556" y="405" font-size="12" fill="#475569">в размер 100 × 60 × 15.</text>
  <text x="556" y="437" font-size="12" fill="#475569">Материал: Д16Т.</text>
</svg>
