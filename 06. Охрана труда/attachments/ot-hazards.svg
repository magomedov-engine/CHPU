<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="856" height="516" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Опасные и вредные факторы на участке станков с ЧПУ</text>

  <rect x="25" y="58" width="560" height="450" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <!-- пол -->
  <line x1="40" y1="455" x2="570" y2="455" stroke="#94A3B8" stroke-width="3"/>
  <ellipse cx="300" cy="462" rx="55" ry="7" fill="#78716C" opacity="0.5"/>
  <!-- станок -->
  <rect x="60" y="100" width="380" height="300" rx="10" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
  <rect x="90" y="130" width="230" height="200" rx="6" fill="#E0F2FE" stroke="#475569" stroke-width="2"/>
  <rect x="340" y="130" width="80" height="120" rx="6" fill="#0F172A"/>
  <rect x="350" y="140" width="60" height="40" fill="#22C55E" opacity="0.6"/>
  <circle cx="400" cy="220" r="12" fill="#DC2626" stroke="#7F1D1D" stroke-width="2"/>
  <!-- шпиндель, инструмент -->
  <rect x="180" y="135" width="50" height="60" fill="#64748B"/>
  <rect x="198" y="195" width="14" height="40" fill="#F59E0B"/>
  <path d="M190,215 A20 8 0 1 0 220,215" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <!-- деталь и стружка -->
  <rect x="150" y="260" width="110" height="30" fill="#FDE68A" stroke="#B45309"/>
  <g stroke="#B45309" stroke-width="2" fill="none">
    <path d="M230,250 q10,-12 20,-4"/><path d="M245,240 q12,-6 18,4"/><path d="M160,248 q-8,-10 -18,-2"/>
  </g>
  <g fill="#38BDF8"><circle cx="270" cy="245" r="3"/><circle cx="280" cy="235" r="2.5"/><circle cx="290" cy="250" r="2"/><circle cx="140" cy="240" r="2.5"/></g>
  <!-- транспортёр и тележка -->
  <rect x="440" y="330" width="40" height="70" fill="#94A3B8" stroke="#475569"/>
  <rect x="470" y="380" width="80" height="60" rx="4" fill="#64748B" stroke="#334155"/>
  <g stroke="#B45309" stroke-width="2" fill="none"><path d="M480,380 q8,-12 16,-2 q8,-12 16,0 q8,-12 16,0"/></g>
  <!-- шкаф -->
  <rect x="450" y="110" width="110" height="200" rx="4" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
  <polygon points="505,150 530,195 480,195" fill="#FACC15" stroke="#1E293B" stroke-width="2"/>
  <path d="M507,160 L498,180 L508,180 L501,192" fill="none" stroke="#1E293B" stroke-width="2.5"/>
  <!-- заготовка тяжёлая -->
  <rect x="60" y="410" width="70" height="45" fill="#78716C" stroke="#44403C"/>
  <text x="95" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">40 кг</text>
  <!-- пистолет обдува -->
  <path d="M330,350 l30,0 l0,10 l-10,0 l-4,20 l-10,0 l4,-20 l-10,0 z" fill="#475569"/>
  <path d="M360,354 l25,-4 M360,356 l25,2" stroke="#38BDF8" stroke-width="2"/>

  <!-- номера -->
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="245" cy="190" r="12" fill="#DC2626"/><text x="245" y="194">1</text>
    <circle cx="270" cy="215" r="12" fill="#DC2626"/><text x="270" y="219">2</text>
    <circle cx="130" cy="275" r="12" fill="#DC2626"/><text x="130" y="279">3</text>
    <circle cx="300" cy="265" r="12" fill="#DC2626"/><text x="300" y="269">4</text>
    <circle cx="100" cy="115" r="12" fill="#DC2626"/><text x="100" y="119">5</text>
    <circle cx="545" cy="125" r="12" fill="#DC2626"/><text x="545" y="129">6</text>
    <circle cx="145" cy="420" r="12" fill="#DC2626"/><text x="145" y="424">7</text>
    <circle cx="300" cy="440" r="12" fill="#DC2626"/><text x="300" y="444">8</text>
    <circle cx="395" cy="365" r="12" fill="#DC2626"/><text x="395" y="369">9</text>
    <circle cx="365" cy="285" r="12" fill="#DC2626"/><text x="365" y="289">10</text>
  </g>

  <rect x="595" y="58" width="240" height="450" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <g font-size="12" fill="#1E293B">
    <text x="610" y="86"><tspan font-weight="700" fill="#DC2626">1</tspan> Вращающиеся части —</text><text x="626" y="101">захват одежды, рук, волос</text>
    <text x="610" y="128"><tspan font-weight="700" fill="#DC2626">2</tspan> Отлетающая стружка,</text><text x="626" y="143">осколки пластин, вылет детали</text>
    <text x="610" y="170"><tspan font-weight="700" fill="#DC2626">3</tspan> Острая и горячая</text><text x="626" y="185">стружка — порезы, ожоги</text>
    <text x="610" y="212"><tspan font-weight="700" fill="#DC2626">4</tspan> СОЖ — брызги, туман,</text><text x="626" y="227">дерматит, раздражение</text>
    <text x="610" y="254"><tspan font-weight="700" fill="#DC2626">5</tspan> Шум (резание,</text><text x="626" y="269">транспортёр, компрессор)</text>
    <text x="610" y="296"><tspan font-weight="700" fill="#DC2626">6</tspan> Электрический ток —</text><text x="626" y="311">электрошкаф, кабели</text>
    <text x="610" y="338"><tspan font-weight="700" fill="#DC2626">7</tspan> Тяжёлые грузы —</text><text x="626" y="353">заготовки, тиски, патроны</text>
    <text x="610" y="380"><tspan font-weight="700" fill="#DC2626">8</tspan> Скользкий пол —</text><text x="626" y="395">масло, СОЖ, стружка</text>
    <text x="610" y="422"><tspan font-weight="700" fill="#DC2626">9</tspan> Сжатый воздух —</text><text x="626" y="437">стружка в глаза</text>
    <text x="610" y="464"><tspan font-weight="700" fill="#DC2626">10</tspan> Движущиеся узлы —</text><text x="626" y="479">магазин, стол, двери:</text><text x="626" y="494">защемление</text>
  </g>
</svg>
