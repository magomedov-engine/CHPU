<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="856" height="416" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Знаки безопасности (ГОСТ 12.4.026): форма и цвет говорят сами</text>
  <g fill="#FFFFFF" stroke="#CBD5E1">
    <rect x="25" y="58" width="127" height="260" rx="10"/><rect x="161" y="58" width="127" height="260" rx="10"/><rect x="297" y="58" width="127" height="260" rx="10"/>
    <rect x="433" y="58" width="127" height="260" rx="10"/><rect x="569" y="58" width="127" height="260" rx="10"/><rect x="705" y="58" width="130" height="260" rx="10"/>
  </g>
  <!-- 1 запрещающий: перчатки -->
  <circle cx="88" cy="140" r="48" fill="#FFFFFF" stroke="#DC2626" stroke-width="9"/>
  <path d="M74,165 L74,128 Q74,122 79,122 Q84,122 84,128 L84,118 Q84,112 89,112 Q94,112 94,118 L94,122 Q94,117 99,117 Q104,117 104,123 L104,150 Q104,165 92,165 Z" fill="#1E293B"/>
  <line x1="54" y1="106" x2="122" y2="174" stroke="#DC2626" stroke-width="9"/>
  <!-- 2 предупреждающий: ток -->
  <polygon points="224,92 276,182 172,182" fill="#FACC15" stroke="#1E293B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M230,112 L212,148 L228,148 L216,174" fill="none" stroke="#1E293B" stroke-width="5" stroke-linejoin="round"/>
  <!-- 3 предписывающий: очки -->
  <circle cx="360" cy="140" r="48" fill="#1D4ED8"/>
  <path d="M325,135 Q325,124 336,124 L384,124 Q395,124 395,135 L395,145 Q395,156 384,156 L370,156 Q364,156 361,148 Q358,156 351,156 L336,156 Q325,156 325,145 Z" fill="#FFFFFF"/>
  <!-- 4 эвакуационный: выход -->
  <rect x="452" y="94" width="90" height="92" rx="4" fill="#16A34A"/>
  <rect x="510" y="104" width="24" height="72" fill="#FFFFFF"/>
  <circle cx="482" cy="114" r="7" fill="#FFFFFF"/>
  <path d="M480,124 L472,150 L484,152 L476,176 M480,130 L494,142 M474,136 L462,146 M480,150 L494,164" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- 5 медицинский: аптечка -->
  <rect x="588" y="94" width="90" height="92" rx="4" fill="#16A34A"/>
  <rect x="624" y="108" width="18" height="64" fill="#FFFFFF"/><rect x="601" y="131" width="64" height="18" fill="#FFFFFF"/>
  <!-- 6 пожарный: огнетушитель -->
  <rect x="725" y="94" width="90" height="92" rx="4" fill="#DC2626"/>
  <rect x="760" y="118" width="22" height="56" rx="6" fill="#FFFFFF"/>
  <rect x="764" y="108" width="14" height="12" fill="#FFFFFF"/>
  <path d="M778,112 L798,112 L802,124" stroke="#FFFFFF" stroke-width="4" fill="none"/>

  <g text-anchor="middle">
    <g font-size="13" font-weight="700">
      <text x="88" y="222" fill="#DC2626">Запрещающий</text><text x="224" y="222" fill="#A16207">Предупреждающий</text><text x="360" y="222" fill="#1D4ED8">Предписывающий</text>
      <text x="496" y="222" fill="#16A34A">Эвакуационный</text><text x="632" y="222" fill="#16A34A">Медицинский</text><text x="770" y="222" fill="#DC2626">Пожарный</text>
    </g>
    <g font-size="11" fill="#475569">
      <text x="88" y="242">красный круг</text><text x="88" y="257">с перечёркиванием</text><text x="88" y="282" fill="#1E293B">«Работать в</text><text x="88" y="297" fill="#1E293B">перчатках запрещено»</text>
      <text x="224" y="242">жёлтый треугольник</text><text x="224" y="257">«внимание!»</text><text x="224" y="282" fill="#1E293B">«Опасность поражения</text><text x="224" y="297" fill="#1E293B">электрическим током»</text>
      <text x="360" y="242">синий круг</text><text x="360" y="257">«сделай так»</text><text x="360" y="282" fill="#1E293B">«Работать в</text><text x="360" y="297" fill="#1E293B">защитных очках»</text>
      <text x="496" y="242">зелёный квадрат</text><text x="496" y="257">путь к спасению</text><text x="496" y="282" fill="#1E293B">«Выход здесь»</text>
      <text x="632" y="242">зелёный квадрат</text><text x="632" y="257">белый крест</text><text x="632" y="282" fill="#1E293B">«Аптечка первой</text><text x="632" y="297" fill="#1E293B">помощи»</text>
      <text x="770" y="242">красный квадрат</text><text x="770" y="257">средства тушения</text><text x="770" y="282" fill="#1E293B">«Огнетушитель»</text>
    </g>
  </g>
  <rect x="25" y="328" width="810" height="80" rx="10" fill="#FEF3C7"/>
  <text x="45" y="352" font-size="13" fill="#92400E"><tspan font-weight="700">Как читать без слов:</tspan> красный — нельзя / пожарное; жёлтый — осторожно; синий — обязательно; зелёный — безопасно.</text>
  <text x="45" y="374" font-size="13" fill="#92400E">Круг — правило (запрет или предписание), треугольник — предупреждение, квадрат — информация.</text>
  <text x="45" y="396" font-size="13" fill="#92400E">Знаки на станке и у входа на участок — это требования, а не украшение: их нарушение — нарушение охраны труда.</text>
</svg>
