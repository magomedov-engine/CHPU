<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="856" height="516" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Спецодежда и СИЗ оператора станков с ЧПУ</text>

  <rect x="25" y="58" width="510" height="450" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <!-- фигура -->
  <path d="M138,92 Q170,64 202,92 L202,100 L138,100 Z" fill="#1E3A8A"/>
  <circle cx="170" cy="118" r="28" fill="#FDE2C4" stroke="#7C2D12" stroke-width="1.5"/>
  <rect x="146" y="108" width="48" height="14" rx="6" fill="#93C5FD" fill-opacity="0.8" stroke="#1E3A8A" stroke-width="2"/>
  <circle cx="142" cy="122" r="5" fill="#F59E0B"/><circle cx="198" cy="122" r="5" fill="#F59E0B"/>
  <path d="M130,155 L210,155 L222,300 L118,300 Z" fill="#1E40AF" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="170" y1="155" x2="170" y2="300" stroke="#1E293B" stroke-width="1.5"/>
  <g fill="#1E293B"><circle cx="170" cy="180" r="2.5"/><circle cx="170" cy="210" r="2.5"/><circle cx="170" cy="240" r="2.5"/><circle cx="170" cy="270" r="2.5"/></g>
  <path d="M130,158 L100,280 L116,284 L140,190" fill="#1E40AF" stroke="#1E293B" stroke-width="1.5"/>
  <path d="M210,158 L240,280 L224,284 L200,190" fill="#1E40AF" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="98" y="274" width="20" height="8" fill="#1E3A8A" transform="rotate(14 108 278)"/>
  <rect x="222" y="274" width="20" height="8" fill="#1E3A8A" transform="rotate(-14 232 278)"/>
  <circle cx="106" cy="292" r="9" fill="#FDE2C4" stroke="#7C2D12"/><circle cx="234" cy="292" r="9" fill="#FDE2C4" stroke="#7C2D12"/>
  <rect x="122" y="300" width="44" height="140" fill="#1E3A8A" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="174" y="300" width="44" height="140" fill="#1E3A8A" stroke="#1E293B" stroke-width="1.5"/>
  <path d="M116,440 L168,440 L168,470 L108,470 Q104,454 116,440 Z" fill="#292524"/>
  <path d="M172,440 L224,440 Q236,454 232,470 L172,470 Z" fill="#292524"/>
  <path d="M108,470 Q104,456 116,446 L128,446 L128,470 Z" fill="#F59E0B"/>
  <path d="M232,470 Q236,456 224,446 L212,446 L212,470 Z" fill="#F59E0B"/>

  <!-- выноски -->
  <g stroke="#64748B" stroke-width="1"><line x1="202" y1="88" x2="290" y2="80"/><line x1="194" y1="115" x2="290" y2="130"/><line x1="203" y1="122" x2="290" y2="180"/><line x1="214" y1="220" x2="290" y2="235"/><line x1="240" y1="290" x2="290" y2="300"/><line x1="230" y1="462" x2="290" y2="420"/></g>
  <g font-size="12" fill="#1E293B">
    <text x="295" y="78"><tspan font-weight="700">1</tspan> Головной убор — волосы</text><text x="311" y="93">убраны полностью</text>
    <text x="295" y="128"><tspan font-weight="700">2</tspan> Защитные очки (щиток)</text><text x="311" y="143">— всегда у станка</text>
    <text x="295" y="178"><tspan font-weight="700">3</tspan> Беруши / наушники</text><text x="311" y="193">при шуме выше 80 дБА</text>
    <text x="295" y="233"><tspan font-weight="700">4</tspan> Хлопковый костюм,</text><text x="311" y="248">застёгнут, без свисающих</text><text x="311" y="263">концов</text>
    <text x="295" y="298"><tspan font-weight="700">5</tspan> Манжеты застёгнуты,</text><text x="311" y="313">руки без перчаток у</text><text x="311" y="328">вращающихся частей</text>
    <text x="295" y="418"><tspan font-weight="700">6</tspan> Обувь с защитным</text><text x="311" y="433">подноском, маслостойкая</text><text x="311" y="448">подошва</text>
  </g>

  <!-- правая панель -->
  <rect x="545" y="58" width="290" height="260" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="560" y="84" font-size="14" font-weight="700" fill="#B91C1C">✘ Запрещено у станка</text>
  <g font-size="12" fill="#1E293B">
    <text x="560" y="110">• Перчатки и рукавицы при работе</text><text x="572" y="125">с вращающимися частями</text>
    <text x="560" y="150">• Кольца, браслеты, часы, цепочки</text>
    <text x="560" y="175">• Шарфы, галстуки, развязанные</text><text x="572" y="190">шнурки, расстёгнутые рукава</text>
    <text x="560" y="215">• Распущенные длинные волосы</text>
    <text x="560" y="240">• Шорты, открытая обувь, синтетика,</text><text x="572" y="255">которая плавится от стружки</text>
    <text x="560" y="280">• Наушники с музыкой, телефон в руке</text>
  </g>
  <rect x="545" y="328" width="290" height="180" rx="10" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="560" y="354" font-size="14" font-weight="700" fill="#15803D">✔ Перчатки — можно, когда</text>
  <g font-size="12" fill="#1E293B">
    <text x="560" y="380">• Носите заготовки и детали</text><text x="572" y="395">(станок не работает)</text>
    <text x="560" y="420">• Убираете стружку при остановленном</text><text x="572" y="435">станке (+ крючок, щётка)</text>
    <text x="560" y="460">• Работаете с СОЖ, моете бак —</text><text x="572" y="475">нитриловые перчатки</text>
    <text x="560" y="497" font-size="11" fill="#475569">Шпиндель крутится — перчаток в зоне нет</text>
  </g>
</svg>
