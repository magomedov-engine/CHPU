<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#1E293B"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="416" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Допуск формы и расположения: как читать рамку</text>

  <!-- рамка крупно -->
  <rect x="25" y="62" width="400" height="340" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <g stroke="#1E293B" stroke-width="2.5" fill="#FFFFFF">
    <rect x="70" y="120" width="70" height="56"/><rect x="140" y="120" width="120" height="56"/><rect x="260" y="120" width="60" height="56"/>
  </g>
  <!-- знак перпендикулярности -->
  <g stroke="#1E293B" stroke-width="3"><line x1="105" y1="132" x2="105" y2="164"/><line x1="87" y1="164" x2="123" y2="164"/></g>
  <text x="200" y="157" text-anchor="middle" font-size="26" font-weight="700" fill="#1E293B">0,02</text>
  <text x="290" y="158" text-anchor="middle" font-size="26" font-weight="700" fill="#1E293B">А</text>
  <g font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">
    <circle cx="105" cy="205" r="11" fill="#F59E0B"/><text x="105" y="209">1</text>
    <circle cx="200" cy="205" r="11" fill="#F59E0B"/><text x="200" y="209">2</text>
    <circle cx="290" cy="205" r="11" fill="#F59E0B"/><text x="290" y="209">3</text>
  </g>
  <g font-size="13" fill="#1E293B">
    <text x="45" y="250"><tspan font-weight="700" fill="#B45309">1</tspan> — знак: ЧТО контролируем</text>
    <text x="65" y="268" fill="#475569">(здесь ⊥ — перпендикулярность)</text>
    <text x="45" y="296"><tspan font-weight="700" fill="#B45309">2</tspan> — допуск в мм: НАСКОЛЬКО можно</text>
    <text x="65" y="314" fill="#475569">отклониться (0,02 мм = 20 мкм)</text>
    <text x="45" y="342"><tspan font-weight="700" fill="#B45309">3</tspan> — база: ОТНОСИТЕЛЬНО ЧЕГО</text>
    <text x="65" y="360" fill="#475569">(у допусков формы базы нет)</text>
  </g>
  <text x="45" y="92" font-size="13" fill="#475569">Читаем слева направо:</text>
  <text x="45" y="108" font-size="13" font-weight="700" fill="#1E293B">«Перпендикулярность 0,02 относительно базы А»</text>

  <!-- пример на детали -->
  <rect x="440" y="62" width="395" height="340" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="637" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">Пример: плита</text>
  <rect x="490" y="190" width="290" height="100" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.5"/>
  <!-- рамка параллельности -->
  <g stroke="#1E293B" stroke-width="2" fill="#FFFFFF">
    <rect x="560" y="110" width="40" height="32"/><rect x="600" y="110" width="60" height="32"/><rect x="660" y="110" width="34" height="32"/>
  </g>
  <g stroke="#1E293B" stroke-width="2.4"><line x1="572" y1="136" x2="580" y2="116"/><line x1="582" y1="136" x2="590" y2="116"/></g>
  <text x="630" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">0,05</text>
  <text x="677" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">А</text>
  <polyline points="580,142 580,165 650,165 650,190" fill="none" stroke="#1E293B" stroke-width="1.3" marker-end="url(#ak)"/>
  <!-- база А -->
  <polygon points="595,290 625,290 610,304" fill="#1E293B"/>
  <line x1="610" y1="304" x2="610" y2="318" stroke="#1E293B" stroke-width="1.3"/>
  <rect x="594" y="318" width="32" height="32" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <text x="610" y="341" text-anchor="middle" font-size="17" font-weight="700" fill="#1E293B">А</text>
  <text x="640" y="315" font-size="12" fill="#475569">← обозначение базы:</text>
  <text x="652" y="331" font-size="12" fill="#475569">залитый треугольник</text>
  <text x="652" y="347" font-size="12" fill="#475569">на базовой поверхности</text>
  <text x="458" y="378" font-size="12" fill="#1E293B">Верхняя плоскость должна быть параллельна</text>
  <text x="458" y="395" font-size="12" fill="#1E293B">нижней (база А) с точностью <tspan font-weight="700">0,05 мм</tspan> по всей длине.</text>
  <text x="700" y="160" font-size="12" fill="#475569">стрелка → на какую</text>
  <text x="700" y="175" font-size="12" fill="#475569">поверхность допуск</text>
</svg>
