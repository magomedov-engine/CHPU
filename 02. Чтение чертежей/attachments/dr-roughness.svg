<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="856" height="496" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Шероховатость поверхности: знаки и значения</text>

  <!-- три знака -->
  <g fill="#FFFFFF" stroke="#CBD5E1"><rect x="25" y="58" width="265" height="140" rx="10"/><rect x="300" y="58" width="265" height="140" rx="10"/><rect x="575" y="58" width="260" height="140" rx="10"/></g>
  <g fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round">
    <polyline points="58,118 70,140 94,96"/>
    <polyline points="333,118 345,140 369,96"/><line x1="333" y1="118" x2="357.5" y2="118"/>
    <polyline points="608,118 620,140 644,96"/><circle cx="621" cy="125" r="6"/>
  </g>
  <g stroke="#1E293B" stroke-width="1.2"><line x1="40" y1="140" x2="110" y2="140"/><line x1="315" y1="140" x2="385" y2="140"/><line x1="590" y1="140" x2="660" y2="140"/></g>
  <g font-size="14" font-weight="700" fill="#1E293B"><text x="120" y="96">Способ</text><text x="395" y="96">Со снятием</text><text x="670" y="96">Без снятия</text></g>
  <g font-size="14" font-weight="700" fill="#1E293B"><text x="120" y="114">не указан</text><text x="395" y="114">материала</text><text x="670" y="114">материала</text></g>
  <g font-size="12" fill="#475569">
    <text x="40" y="168">Годится любой способ</text><text x="40" y="185">получения поверхности</text>
    <text x="315" y="168">Точить, фрезеровать, шлифовать —</text><text x="315" y="185">⭐ основной знак для оператора</text>
    <text x="590" y="168">Литьё, прокат, штамповка:</text><text x="590" y="185">эту поверхность НЕ обрабатывать</text>
  </g>

  <!-- полный знак -->
  <rect x="25" y="210" width="400" height="160" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <line x1="45" y1="340" x2="260" y2="340" stroke="#1E293B" stroke-width="3"/>
  <g stroke="#1E293B" stroke-width="1"><line x1="55" y1="340" x2="45" y2="352"/><line x1="75" y1="340" x2="65" y2="352"/><line x1="95" y1="340" x2="85" y2="352"/><line x1="115" y1="340" x2="105" y2="352"/><line x1="135" y1="340" x2="125" y2="352"/><line x1="155" y1="340" x2="145" y2="352"/><line x1="175" y1="340" x2="165" y2="352"/><line x1="195" y1="340" x2="185" y2="352"/><line x1="215" y1="340" x2="205" y2="352"/><line x1="235" y1="340" x2="225" y2="352"/><line x1="255" y1="340" x2="245" y2="352"/></g>
  <g fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round">
    <polyline points="90,306 110,340 150,270 235,270"/><line x1="90" y1="306" x2="129.4" y2="306"/>
  </g>
  <text x="158" y="292" font-size="20" font-weight="700" fill="#1E63D6">Ra 1,6</text>
  <text x="270" y="250" font-size="12" fill="#1E293B">← параметр и значение,</text>
  <text x="285" y="266" font-size="12" fill="#1E293B">мкм (под полкой)</text>
  <text x="270" y="318" font-size="12" fill="#1E293B">← вершина знака касается</text>
  <text x="285" y="334" font-size="12" fill="#1E293B">поверхности детали</text>
  <text x="45" y="235" font-size="13" font-weight="700" fill="#1E293B">Знак на поверхности</text>

  <!-- общий знак -->
  <rect x="435" y="210" width="400" height="160" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="455" y="235" font-size="13" font-weight="700" fill="#1E293B">Знак в правом верхнем углу чертежа</text>
  <text x="470" y="292" font-size="24" font-weight="700" fill="#1E63D6">Ra 6,3</text>
  <text x="565" y="294" font-size="30" fill="#1E293B">(</text>
  <polyline points="578,276 584,288 596,264" fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="600" y="294" font-size="30" fill="#1E293B">)</text>
  <text x="455" y="325" font-size="12" fill="#1E293B">Все поверхности, на которых шероховатость</text>
  <text x="455" y="342" font-size="12" fill="#1E293B">не указана отдельно, — <tspan font-weight="700">Ra 6,3</tspan>.</text>
  <text x="455" y="359" font-size="12" fill="#475569">Знак √ в скобках = «кроме тех, что указаны на изображении»</text>

  <!-- шкала -->
  <text x="40" y="392" font-size="13" font-weight="700" fill="#1E293B">Ra, мкм: чем меньше число — тем глаже поверхность</text>
  <g stroke="#FFFFFF" stroke-width="2">
    <rect x="40" y="398" width="86.7" height="30" fill="#92400E"/><rect x="126.7" y="398" width="86.7" height="30" fill="#B45309"/><rect x="213.3" y="398" width="86.7" height="30" fill="#D97706"/>
    <rect x="300" y="398" width="86.7" height="30" fill="#F59E0B"/><rect x="386.7" y="398" width="86.7" height="30" fill="#FBBF24"/>
    <rect x="473.3" y="398" width="86.7" height="30" fill="#93C5FD"/><rect x="560" y="398" width="86.7" height="30" fill="#60A5FA"/>
    <rect x="646.7" y="398" width="86.7" height="30" fill="#3B82F6"/><rect x="733.3" y="398" width="86.7" height="30" fill="#1D4ED8"/>
  </g>
  <g font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <text x="83" y="418">50</text><text x="170" y="418">25</text><text x="257" y="418">12,5</text>
    <text x="343" y="418" fill="#1E293B">6,3</text><text x="430" y="418" fill="#1E293B">3,2</text>
    <text x="517" y="418" fill="#1E293B">1,6</text><text x="603" y="418" fill="#1E293B">0,8</text>
    <text x="690" y="418">0,4</text><text x="777" y="418">0,2</text>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.5">
    <polyline points="44,436 44,442 296,442 296,436"/><polyline points="304,436 304,442 469,442 469,436"/>
    <polyline points="477,436 477,442 643,442 643,436"/><polyline points="651,436 651,442 816,442 816,436"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#1E293B">
    <text x="170" y="460" font-weight="700">Черновая обработка</text><text x="170" y="477" fill="#475569">прокат, литьё, грубое точение</text>
    <text x="386" y="460" font-weight="700">Получистовая</text><text x="386" y="477" fill="#475569">обычное точение, фрезерование</text>
    <text x="560" y="460" font-weight="700">Чистовая</text><text x="560" y="477" fill="#475569">чистовое точение, развёртка</text>
    <text x="733" y="460" font-weight="700">Шлифование</text><text x="733" y="477" fill="#475569">тонкое точение, шлифование</text>
  </g>
</svg>
