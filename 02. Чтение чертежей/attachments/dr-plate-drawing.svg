  <!-- ТТ -->
  <text x="560" y="410" font-size="14" font-weight="700" fill="#1E293B">Технические требования</text>
  <g font-size="13" fill="#1E293B">
    <text x="560" y="436">1. Общие допуски по</text>
    <text x="578" y="454">ГОСТ 30893.1-m.</text>
    <text x="560" y="478">2. Острые кромки притупить.</text>
    <text x="560" y="502">3. Покрытие: Ан.Окс.нхр.</text>
  </g>
  <!-- база -->
