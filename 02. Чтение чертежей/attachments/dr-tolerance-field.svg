<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="856" height="496" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Поля допусков: номинал Ø30, разные отклонения</text>

  <rect x="25" y="62" width="520" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <!-- ось мкм -->
  <line x1="80" y1="110" x2="80" y2="390" stroke="#64748B" stroke-width="1.5"/>
  <g font-size="11" fill="#475569" text-anchor="end">
    <line x1="75" y1="120" x2="85" y2="120" stroke="#64748B"/><text x="70" y="124">+40</text>
    <line x1="75" y1="200" x2="85" y2="200" stroke="#64748B"/><text x="70" y="204">+20</text>
    <line x1="75" y1="360" x2="85" y2="360" stroke="#64748B"/><text x="70" y="364">−20</text>
  </g>
  <text x="40" y="100" font-size="11" fill="#475569">мкм</text>
  <!-- нулевая линия -->
  <line x1="80" y1="280" x2="530" y2="280" stroke="#1E293B" stroke-width="2.5"/>
  <text x="70" y="284" text-anchor="end" font-size="11" font-weight="700" fill="#1E293B">0</text>
  <text x="530" y="300" text-anchor="end" font-size="12" font-weight="700" fill="#1E293B">нулевая линия = номинал 30,000</text>

  <!-- H7 -->
  <rect x="105" y="196" width="80" height="84" fill="#DBEAFE" stroke="#1E63D6" stroke-width="2"/>
  <text x="145" y="243" text-anchor="middle" font-size="18" font-weight="700" fill="#1E63D6">H7</text>
  <text x="145" y="189" text-anchor="middle" font-size="11" fill="#1E63D6">+0,021</text>
  <text x="145" y="325" text-anchor="middle" font-size="11" fill="#1E63D6">отверстие</text>
  <!-- h7 -->
  <rect x="210" y="280" width="80" height="84" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <text x="250" y="327" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">h7</text>
  <text x="250" y="380" text-anchor="middle" font-size="11" fill="#B45309">−0,021</text>
  <text x="250" y="268" text-anchor="middle" font-size="11" fill="#B45309">вал</text>
  <!-- g6 -->
  <rect x="315" y="308" width="80" height="52" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <text x="355" y="340" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">g6</text>
  <text x="355" y="301" text-anchor="middle" font-size="11" fill="#B45309">−0,007</text>
  <text x="355" y="376" text-anchor="middle" font-size="11" fill="#B45309">−0,020</text>
  <!-- p6 -->
  <rect x="420" y="140" width="80" height="52" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <text x="460" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#B45309">p6</text>
  <text x="460" y="133" text-anchor="middle" font-size="11" fill="#B45309">+0,035</text>
  <text x="460" y="207" text-anchor="middle" font-size="11" fill="#B45309">+0,022</text>

  <text x="40" y="420" font-size="12" fill="#1E293B">Заглавная буква (H) — <tspan font-weight="700" fill="#1E63D6">отверстие</tspan>, строчная (h, g, p) — <tspan font-weight="700" fill="#B45309">вал</tspan>.</text>
  <text x="40" y="440" font-size="12" fill="#1E293B">H7 + g6 → вал всегда меньше отверстия: <tspan font-weight="700">посадка с зазором</tspan>.</text>
  <text x="40" y="460" font-size="12" fill="#1E293B">H7 + p6 → вал всегда больше отверстия: <tspan font-weight="700">посадка с натягом</tspan> (запрессовка).</text>

  <!-- расчёт -->
  <rect x="560" y="62" width="275" height="420" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="577" y="90" font-size="15" font-weight="700" fill="#1E293B">Считаем Ø30h7</text>
  <text x="577" y="114" font-size="12" fill="#475569">по таблице: es = 0, ei = −0,021</text>
  <g font-size="13" fill="#1E293B">
    <text x="577" y="146">Номинал</text><text x="818" y="146" text-anchor="end" font-weight="700">30,000</text>
    <text x="577" y="172">Наибольший размер</text><text x="818" y="172" text-anchor="end" font-weight="700">30,000</text>
    <text x="577" y="198">Наименьший размер</text><text x="818" y="198" text-anchor="end" font-weight="700">29,979</text>
    <line x1="577" y1="210" x2="818" y2="210" stroke="#E2E8F0"/>
    <text x="577" y="232">Допуск (разница)</text><text x="818" y="232" text-anchor="end" font-weight="700">0,021</text>
    <text x="577" y="258">Середина поля</text><text x="818" y="258" text-anchor="end" font-weight="700" fill="#15803D">≈ 29,990</text>
  </g>
  <rect x="577" y="276" width="241" height="88" rx="8" fill="#DCFCE7"/>
  <text x="590" y="298" font-size="12" fill="#14532D">✔ годно: 29,979 … 30,000</text>
  <text x="590" y="318" font-size="12" fill="#14532D">Настраиваемся на середину —</text>
  <text x="590" y="336" font-size="12" fill="#14532D">остаётся запас на износ</text>
  <text x="590" y="354" font-size="12" fill="#14532D">инструмента в обе стороны.</text>
  <rect x="577" y="374" width="241" height="92" rx="8" fill="#FEE2E2"/>
  <text x="590" y="396" font-size="12" fill="#7F1D1D">✘ 30,005 — брак исправимый</text>
  <text x="590" y="414" font-size="12" fill="#7F1D1D">(вал больше — можно доточить)</text>
  <text x="590" y="438" font-size="12" fill="#7F1D1D">✘ 29,970 — брак неисправимый</text>
  <text x="590" y="456" font-size="12" fill="#7F1D1D">(металл уже не нарастить)</text>
</svg>
