<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E63D6"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="516" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Три вида детали и как они расположены (ЕСКД)</text>

  <rect x="30" y="70" width="420" height="380" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <!-- линии связи -->
  <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 4">
    <line x1="70" y1="250" x2="70" y2="290"/><line x1="107.5" y1="250" x2="107.5" y2="290"/><line x1="220" y1="250" x2="220" y2="290"/><line x1="170" y1="257" x2="170" y2="290"/>
    <line x1="220" y1="150" x2="270" y2="150"/><line x1="220" y1="225" x2="270" y2="225"/><line x1="220" y1="250" x2="270" y2="250"/>
  </g>

  <!-- главный вид -->
  <polygon points="70,250 220,250 220,225 107.5,225 107.5,150 70,150" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.5"/>
  <g stroke="#1E293B" stroke-width="1.4" stroke-dasharray="6 4"><line x1="157.5" y1="225" x2="157.5" y2="250"/><line x1="182.5" y1="225" x2="182.5" y2="250"/></g>
  <line x1="170" y1="216" x2="170" y2="259" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="10 3 2 3"/>
  <text x="145" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#1E63D6">Главный вид (спереди)</text>

  <!-- вид слева -->
  <polygon points="270,250 370,250 370,225 320,225 320,150 270,150" fill="#F0FDF4" stroke="#1E293B" stroke-width="2.5"/>
  <g stroke="#1E293B" stroke-width="1.4" stroke-dasharray="6 4"><line x1="307.5" y1="225" x2="307.5" y2="250"/><line x1="332.5" y1="225" x2="332.5" y2="250"/></g>
  <text x="320" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D32">Вид слева</text>
  <text x="320" y="272" text-anchor="middle" font-size="11" fill="#475569">ставится СПРАВА</text>
  <text x="320" y="286" text-anchor="middle" font-size="11" fill="#475569">от главного</text>

  <!-- вид сверху -->
  <rect x="70" y="290" width="150" height="100" fill="#FFF7ED" stroke="#1E293B" stroke-width="2.5"/>
  <polyline points="107.5,290 107.5,340 70,340" fill="none" stroke="#1E293B" stroke-width="2.5"/>
  <circle cx="170" cy="340" r="12.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
  <g stroke="#1E293B" stroke-width="0.9" stroke-dasharray="10 3 2 3"><line x1="150" y1="340" x2="190" y2="340"/><line x1="170" y1="320" x2="170" y2="360"/></g>
  <text x="145" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">Вид сверху</text>
  <text x="145" y="426" text-anchor="middle" font-size="11" fill="#475569">ставится ПОД главным</text>

  <text x="240" y="340" font-size="11" fill="#475569">штриховые линии —</text>
  <text x="240" y="354" font-size="11" fill="#475569">отверстие, которое</text>
  <text x="240" y="368" font-size="11" fill="#475569">на этом виде не видно</text>

  <!-- изометрия -->
  <text x="650" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Деталь в изометрии (для наглядности)</text>
  <g stroke="#1E293B" stroke-width="2" stroke-linejoin="round">
    <polygon points="640,430 754.3,364 754.3,342 640,408" fill="#EFF6FF"/>
    <polygon points="640,430 563.8,386 563.8,364 640,408" fill="#F0FDF4"/>
    <polygon points="640,408 754.3,342 678.1,298 563.8,364" fill="#FFF7ED"/>
    <ellipse cx="678.1" cy="342" rx="13.5" ry="7.8" fill="#FFFFFF"/>
    <polygon points="601.9,386 630.5,369.5 630.5,303.5 601.9,320" fill="#EFF6FF"/>
    <polygon points="601.9,386 563.8,364 563.8,298 601.9,320" fill="#F0FDF4"/>
    <polygon points="601.9,320 630.5,303.5 592.4,281.5 563.8,298" fill="#FFF7ED"/>
  </g>
  <line x1="740" y1="470" x2="700" y2="400" stroke="#1E63D6" stroke-width="3" marker-end="url(#ab)"/>
  <text x="748" y="480" font-size="12" fill="#1E63D6">взгляд для главного вида</text>
  <line x1="510" y1="440" x2="580" y2="395" stroke="#2E7D32" stroke-width="3" marker-end="url(#ab)"/>
  <text x="470" y="458" font-size="12" fill="#2E7D32">взгляд слева</text>

  <rect x="30" y="462" width="420" height="44" rx="8" fill="#FEF3C7"/>
  <text x="240" y="480" text-anchor="middle" font-size="12" fill="#92400E">Каждый вид показывает 2 измерения из 3. Читаем их ВМЕСТЕ:</text>
  <text x="240" y="497" text-anchor="middle" font-size="12" fill="#92400E">ширину — по главному и сверху, высоту — по главному и слева.</text>
</svg>
