<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="h" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="9" stroke="#1E293B" stroke-width="1.1"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="856" height="436" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Как резьба изображается на чертеже (ГОСТ 2.311)</text>

  <!-- наружная -->
  <rect x="25" y="62" width="400" height="360" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="225" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Наружная резьба (на стержне)</text>
  <line x1="45" y1="200" x2="315" y2="200" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="14 3 2 3"/>
  <path d="M60,160 L294,160 L300,166 L300,234 L294,240 L60,240" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M60,160 C52,180 68,190 60,200 S52,225 60,240" fill="none" stroke="#1E293B" stroke-width="1.2"/>
  <line x1="140" y1="160" x2="140" y2="240" stroke="#1E293B" stroke-width="2.5"/>
  <line x1="294" y1="160" x2="294" y2="240" stroke="#1E293B" stroke-width="2"/>
  <g stroke="#1E293B" stroke-width="1.1"><line x1="140" y1="166" x2="300" y2="166"/><line x1="140" y1="234" x2="300" y2="234"/></g>
  <text x="220" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#1E63D6">M20</text>
  <!-- вид с торца -->
  <circle cx="365" cy="200" r="40" fill="#EFF6FF" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M398.5,205.9 A34 34 0 1 1 370.9,166.5" fill="none" stroke="#1E293B" stroke-width="1.1"/>
  <g stroke="#1E293B" stroke-width="0.9" stroke-dasharray="10 3 2 3"><line x1="318" y1="200" x2="412" y2="200"/><line x1="365" y1="153" x2="365" y2="247"/></g>
  <g font-size="12" fill="#1E293B">
    <text x="45" y="280"><tspan font-weight="700">Толстая</tspan> линия — по <tspan font-weight="700">наружному</tspan> Ø резьбы (20 мм)</text>
    <text x="45" y="300"><tspan font-weight="700">Тонкая</tspan> — по <tspan font-weight="700">внутреннему</tspan> Ø (дно витков)</text>
    <text x="45" y="320"><tspan font-weight="700">Толстая поперечная</tspan> — граница резьбы</text>
    <text x="45" y="340">На торце — тонкая дуга примерно на 3/4 круга</text>
  </g>
  <rect x="45" y="356" width="360" height="52" rx="8" fill="#FEF3C7"/>
  <text x="58" y="378" font-size="12" fill="#92400E">Витки не рисуют! Резьбу узнают по паре линий</text>
  <text x="58" y="396" font-size="12" fill="#92400E">«толстая + тонкая» и по обозначению M…</text>

  <!-- внутренняя -->
  <rect x="440" y="62" width="395" height="360" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="637" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#1E293B">Внутренняя резьба (в отверстии), разрез</text>
  <path d="M470,130 L650,130 L650,270 L470,270 L470,234 L600,234 L620.4,200 L600,166 L470,166 Z" fill="url(#h)" stroke="#1E293B" stroke-width="2.5"/>
  <g stroke="#1E293B" stroke-width="1.1"><line x1="470" y1="160" x2="570" y2="160"/><line x1="470" y1="240" x2="570" y2="240"/></g>
  <line x1="570" y1="160" x2="570" y2="240" stroke="#1E293B" stroke-width="2.5"/>
  <line x1="600" y1="166" x2="600" y2="234" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="455" y1="200" x2="640" y2="200" stroke="#1E293B" stroke-width="0.9" stroke-dasharray="14 3 2 3"/>
  <text x="520" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#1E63D6">M20-7H</text>
  <!-- вид с торца -->
  <circle cx="740" cy="200" r="34" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M779.4,206.9 A40 40 0 1 1 746.9,160.6" fill="none" stroke="#1E293B" stroke-width="1.1"/>
  <g stroke="#1E293B" stroke-width="0.9" stroke-dasharray="10 3 2 3"><line x1="690" y1="200" x2="790" y2="200"/><line x1="740" y1="150" x2="740" y2="250"/></g>
  <text x="625" y="290" font-size="11" fill="#475569">конус 118° от сверла</text>
  <g font-size="12" fill="#1E293B">
    <text x="458" y="320"><tspan font-weight="700">Толстая</tspan> — по <tspan font-weight="700">внутреннему</tspan> Ø (отверстие под резьбу)</text>
    <text x="458" y="340"><tspan font-weight="700">Тонкая</tspan> — по <tspan font-weight="700">наружному</tspan> Ø резьбы</text>
    <text x="458" y="360">Штриховка доходит до толстой линии</text>
    <text x="458" y="380">Сверлят глубже резьбы — метчику нужен выход</text>
    <text x="458" y="400">На торце: толстый круг + тонкая дуга 3/4</text>
  </g>
</svg>
