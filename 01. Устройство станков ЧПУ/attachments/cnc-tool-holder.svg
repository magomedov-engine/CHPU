<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E53935"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="436" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Инструментальная оправка (BT40) с цангой и фрезой</text>

  <line x1="40" y1="220" x2="830" y2="220" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="14 5 3 5"/>
  <!-- штырь -->
  <rect x="60" y="205" width="40" height="30" rx="3" fill="#64748B" stroke="#334155" stroke-width="2"/>
  <rect x="50" y="200" width="16" height="40" rx="3" fill="#64748B" stroke="#334155" stroke-width="2"/>
  <!-- конус -->
  <polygon points="100,195 260,160 260,280 100,245" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <text x="180" y="225" text-anchor="middle" font-size="13" fill="#1E293B">конус 7:24</text>
  <!-- фланец -->
  <rect x="260" y="135" width="50" height="170" rx="4" fill="#475569" stroke="#1E293B" stroke-width="2"/>
  <polygon points="273,135 297,135 285,150" fill="#F8FAFC"/>
  <polygon points="273,305 297,305 285,290" fill="#F8FAFC"/>
  <!-- корпус -->
  <polygon points="310,170 420,185 420,255 310,270" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <!-- гайка -->
  <rect x="420" y="178" width="55" height="84" rx="6" fill="#64748B" stroke="#334155" stroke-width="2"/>
  <!-- фреза -->
  <rect x="475" y="203" width="250" height="34" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
  <g stroke="#B45309" stroke-width="2"><line x1="590" y1="237" x2="610" y2="203"/><line x1="620" y1="237" x2="640" y2="203"/><line x1="650" y1="237" x2="670" y2="203"/><line x1="680" y1="237" x2="700" y2="203"/><line x1="710" y1="237" x2="725" y2="210"/></g>

  <!-- выноски -->
  <g font-size="14" fill="#1E293B">
    <line x1="70" y1="200" x2="70" y2="110" stroke="#64748B"/><text x="40" y="100">① Штырь (pull stud)</text>
    <line x1="180" y1="180" x2="180" y2="135" stroke="#64748B"/><text x="200" y="85" text-anchor="middle"></text>
    <text x="140" y="128">② Конус</text>
    <line x1="285" y1="135" x2="300" y2="95" stroke="#64748B"/><text x="280" y="88">③ Фланец с пазом для манипулятора</text>
    <line x1="365" y1="265" x2="365" y2="330" stroke="#64748B"/><text x="320" y="345">④ Корпус</text>
    <line x1="448" y1="262" x2="448" y2="330" stroke="#64748B"/><text x="425" y="345">⑤ Гайка + цанга</text>
    <line x1="650" y1="203" x2="680" y2="140" stroke="#64748B"/><text x="640" y="132">⑥ Фреза</text>
  </g>

  <!-- вылет -->
  <line x1="260" y1="310" x2="260" y2="395" stroke="#E53935" stroke-dasharray="4 3"/>
  <line x1="725" y1="240" x2="725" y2="395" stroke="#E53935" stroke-dasharray="4 3"/>
  <line x1="262" y1="385" x2="723" y2="385" stroke="#E53935" stroke-width="2.5" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <text x="492" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#E53935">Длина инструмента (вылет) — заносится в корректор H</text>
  <text x="260" y="415" text-anchor="middle" font-size="12" fill="#334155">базовый торец шпинделя</text>
  <text x="725" y="415" text-anchor="middle" font-size="12" fill="#334155">вершина инструмента</text>
  <text x="560" y="300" font-size="12" fill="#334155">Конус + штырь — затягиваются в шпиндель.</text>
  <text x="560" y="316" font-size="12" fill="#334155">Фланец — за него хватает автооператор.</text>
</svg>
