<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E53935"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E63D6"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="476" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Правило правой руки: линейные оси X Y Z и поворотные A B C</text>

  <!-- triad -->
  <circle cx="230" cy="300" r="7" fill="#1E293B"/>
  <line x1="230" y1="300" x2="420" y2="300" stroke="#E53935" stroke-width="5" marker-end="url(#ar)"/>
  <line x1="230" y1="300" x2="350" y2="190" stroke="#2E7D32" stroke-width="5" marker-end="url(#ag)"/>
  <line x1="230" y1="300" x2="230" y2="100" stroke="#1E63D6" stroke-width="5" marker-end="url(#ab)"/>
  <text x="430" y="308" font-size="26" font-weight="700" fill="#E53935">X+</text>
  <text x="358" y="185" font-size="26" font-weight="700" fill="#2E7D32">Y+</text>
  <text x="215" y="90" font-size="26" font-weight="700" fill="#1E63D6">Z+</text>

  <!-- A around X -->
  <ellipse cx="370" cy="300" rx="14" ry="34" fill="none" stroke="#E53935" stroke-width="2.5" stroke-dasharray="70 30"/>
  <text x="358" y="358" font-size="18" font-weight="700" fill="#E53935">A</text>
  <!-- B around Y -->
  <ellipse cx="315" cy="222" rx="30" ry="14" transform="rotate(-42 315 222)" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-dasharray="70 30"/>
  <text x="270" y="210" font-size="18" font-weight="700" fill="#2E7D32">B</text>
  <!-- C around Z -->
  <ellipse cx="230" cy="150" rx="34" ry="12" fill="none" stroke="#1E63D6" stroke-width="2.5" stroke-dasharray="70 30"/>
  <text x="275" y="140" font-size="18" font-weight="700" fill="#1E63D6">C</text>
  <text x="160" y="400" font-size="13" fill="#334155">Начало координат — точка пересечения осей.</text>
  <text x="160" y="418" font-size="13" fill="#334155">Стрелка показывает «плюс» направления.</text>

  <!-- explanation -->
  <rect x="490" y="80" width="345" height="370" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="510" y="110" font-size="17" font-weight="700" fill="#1E293B">Как запомнить</text>
  <text x="510" y="140" font-size="14" fill="#1E293B">Вытяните правую руку:</text>
  <circle cx="520" cy="167" r="9" fill="#E53935"/><text x="540" y="172" font-size="14" fill="#1E293B"><tspan font-weight="700">большой палец</tspan> → X+</text>
  <circle cx="520" cy="195" r="9" fill="#2E7D32"/><text x="540" y="200" font-size="14" fill="#1E293B"><tspan font-weight="700">указательный</tspan> → Y+</text>
  <circle cx="520" cy="223" r="9" fill="#1E63D6"/><text x="540" y="228" font-size="14" fill="#1E293B"><tspan font-weight="700">средний</tspan> (согнут к себе) → Z+</text>
  <line x1="510" y1="250" x2="815" y2="250" stroke="#E2E8F0"/>
  <text x="510" y="278" font-size="14" fill="#1E293B">Поворотные оси:</text>
  <text x="510" y="303" font-size="14" fill="#E53935"><tspan font-weight="700">A</tspan> — вращение вокруг X</text>
  <text x="510" y="327" font-size="14" fill="#2E7D32"><tspan font-weight="700">B</tspan> — вращение вокруг Y</text>
  <text x="510" y="351" font-size="14" fill="#1E63D6"><tspan font-weight="700">C</tspan> — вращение вокруг Z</text>
  <line x1="510" y1="370" x2="815" y2="370" stroke="#E2E8F0"/>
  <text x="510" y="396" font-size="13" fill="#334155">Положительное вращение: если большой</text>
  <text x="510" y="414" font-size="13" fill="#334155">палец смотрит в «+» оси, остальные пальцы,</text>
  <text x="510" y="432" font-size="13" fill="#334155">сжимаясь в кулак, показывают «+» поворота.</text>
</svg>
