<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E53935"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="516" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Нулевые точки: станка (M), референтная (R), детали (W)</text>

  <!-- рабочая зона / стол вид сверху -->
  <rect x="60" y="80" width="520" height="380" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="75" y="102" font-size="13" fill="#475569">Стол станка, вид сверху (рабочая зона)</text>
  <line x1="70" y1="170" x2="570" y2="170" stroke="#CBD5E1" stroke-width="6"/>
  <line x1="70" y1="270" x2="570" y2="270" stroke="#CBD5E1" stroke-width="6"/>
  <line x1="70" y1="370" x2="570" y2="370" stroke="#CBD5E1" stroke-width="6"/>

  <!-- M -->
  <g transform="translate(560,100)">
    <circle r="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M0,0 L0,-16 A16 16 0 0 1 16 0 z" fill="#1E293B"/>
    <path d="M0,0 L0,16 A16 16 0 0 1 -16 0 z" fill="#1E293B"/>
  </g>
  <text x="540" y="140" text-anchor="end" font-size="15" font-weight="700" fill="#1E293B">M — нуль станка</text>
  <!-- R -->
  <g transform="translate(500,100)">
    <circle r="13" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#7C3AED" stroke-width="2.5"/>
    <line x1="-9" y1="9" x2="9" y2="-9" stroke="#7C3AED" stroke-width="2.5"/>
  </g>
  <text x="485" y="104" text-anchor="end" font-size="14" font-weight="700" fill="#7C3AED">R — референтная</text>

  <!-- деталь -->
  <rect x="190" y="230" width="200" height="140" fill="#FDE68A" stroke="#B45309" stroke-width="2.5"/>
  <text x="290" y="305" text-anchor="middle" font-size="15" fill="#92400E">Заготовка</text>
  <!-- W -->
  <g transform="translate(190,370)">
    <circle r="15" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5"/>
    <path d="M0,0 L15,0 A15 15 0 0 1 0 15 z" fill="#0F766E"/>
    <path d="M0,0 L-15,0 A15 15 0 0 1 0 -15 z" fill="#0F766E"/>
  </g>
  <line x1="190" y1="370" x2="250" y2="370" stroke="#E53935" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="190" y1="370" x2="190" y2="310" stroke="#2E7D32" stroke-width="3" marker-end="url(#ag)"/>
  <text x="252" y="388" font-size="13" font-weight="700" fill="#E53935">X</text>
  <text x="170" y="315" font-size="13" font-weight="700" fill="#2E7D32">Y</text>
  <text x="160" y="410" font-size="15" font-weight="700" fill="#0F766E">W — нуль детали (G54)</text>

  <!-- смещения -->
  <line x1="190" y1="440" x2="560" y2="440" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <text x="375" y="455" text-anchor="middle" font-size="13" fill="#334155">смещение по X (записывается в G54)</text>
  <line x1="610" y1="100" x2="610" y2="370" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#ak)" marker-end="url(#ak)"/>
  <line x1="190" y1="370" x2="610" y2="370" stroke="#94A3B8" stroke-dasharray="2 4"/>
  <line x1="560" y1="100" x2="610" y2="100" stroke="#94A3B8" stroke-dasharray="2 4"/>
  <line x1="190" y1="370" x2="190" y2="440" stroke="#94A3B8" stroke-dasharray="2 4"/>
  <line x1="560" y1="100" x2="560" y2="440" stroke="#94A3B8" stroke-dasharray="2 4"/>
  <text x="630" y="235" transform="rotate(-90 630 235)" text-anchor="middle" font-size="13" fill="#334155">смещение по Y (G54)</text>

  <!-- legend -->
  <rect x="660" y="80" width="180" height="380" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="675" y="108" font-size="15" font-weight="700" fill="#1E293B">Кратко</text>
  <text x="675" y="138" font-size="13" font-weight="700" fill="#1E293B">M</text>
  <text x="695" y="138" font-size="13" fill="#334155">задан заводом,</text>
  <text x="695" y="155" font-size="13" fill="#334155">не меняется</text>
  <text x="675" y="190" font-size="13" font-weight="700" fill="#7C3AED">R</text>
  <text x="695" y="190" font-size="13" fill="#334155">куда станок едет</text>
  <text x="695" y="207" font-size="13" fill="#334155">при «выходе в ноль»,</text>
  <text x="695" y="224" font-size="13" fill="#334155">часто совпадает с M</text>
  <text x="675" y="259" font-size="13" font-weight="700" fill="#0F766E">W</text>
  <text x="695" y="259" font-size="13" fill="#334155">выбирает технолог</text>
  <text x="695" y="276" font-size="13" fill="#334155">/ оператор, задаётся</text>
  <text x="695" y="293" font-size="13" fill="#334155">для каждой детали</text>
  <line x1="675" y1="315" x2="825" y2="315" stroke="#E2E8F0"/>
  <text x="675" y="340" font-size="12" fill="#334155">Программа пишется</text>
  <text x="675" y="356" font-size="12" fill="#334155">от W. Станок сам</text>
  <text x="675" y="372" font-size="12" fill="#334155">пересчитывает в свои</text>
  <text x="675" y="388" font-size="12" fill="#334155">координаты, прибавляя</text>
  <text x="675" y="404" font-size="12" fill="#334155">смещение из G54.</text>
</svg>
