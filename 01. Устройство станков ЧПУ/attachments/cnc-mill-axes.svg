<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E53935"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E63D6"/></marker>
  </defs>
  <rect x="2" y="2" width="856" height="536" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Вертикальный фрезерный обрабатывающий центр — схема и оси</text>

  <!-- станина -->
  <rect x="90" y="430" width="500" height="60" rx="6" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
  <!-- колонна -->
  <rect x="450" y="100" width="120" height="330" rx="6" fill="#64748B" stroke="#334155" stroke-width="2"/>
  <line x1="470" y1="110" x2="470" y2="420" stroke="#475569" stroke-width="3"/>
  <line x1="550" y1="110" x2="550" y2="420" stroke="#475569" stroke-width="3"/>
  <!-- шпиндельная бабка -->
  <rect x="300" y="150" width="170" height="95" rx="8" fill="#475569" stroke="#1E293B" stroke-width="2"/>
  <rect x="440" y="60" width="50" height="40" rx="4" fill="#334155"/>
  <text x="465" y="85" text-anchor="middle" font-size="11" fill="#F8FAFC">мотор</text>
  <!-- шпиндель и инструмент -->
  <rect x="360" y="245" width="50" height="40" fill="#334155" stroke="#1E293B" stroke-width="2"/>
  <polygon points="365,285 405,285 398,300 372,300" fill="#475569"/>
  <rect x="378" y="300" width="14" height="38" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
  <line x1="378" y1="308" x2="392" y2="316" stroke="#B45309"/><line x1="378" y1="318" x2="392" y2="326" stroke="#B45309"/><line x1="378" y1="328" x2="392" y2="336" stroke="#B45309"/>
  <!-- салазки -->
  <rect x="150" y="400" width="300" height="30" rx="4" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
  <!-- стол -->
  <rect x="120" y="370" width="360" height="30" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <line x1="130" y1="380" x2="470" y2="380" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="130" y1="390" x2="470" y2="390" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- тиски + заготовка -->
  <rect x="320" y="352" width="130" height="18" fill="#9CA3AF" stroke="#4B5563"/>
  <rect x="345" y="340" width="80" height="12" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>

  <!-- оси -->
  <line x1="140" y1="345" x2="290" y2="345" stroke="#E53935" stroke-width="4" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="215" y="335" text-anchor="middle" font-size="22" font-weight="700" fill="#E53935">X</text>
  <text x="215" y="362" text-anchor="middle" font-size="12" fill="#E53935">стол влево-вправо</text>

  <line x1="110" y1="470" x2="60" y2="510" stroke="#2E7D32" stroke-width="4" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="40" y="470" font-size="22" font-weight="700" fill="#2E7D32">Y</text>
  <text x="120" y="515" font-size="12" fill="#2E7D32">стол к оператору / от оператора</text>

  <line x1="275" y1="150" x2="275" y2="290" stroke="#1E63D6" stroke-width="4" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="250" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="#1E63D6">Z</text>
  <text x="200" y="245" text-anchor="middle" font-size="12" fill="#1E63D6">шпиндель</text>
  <text x="200" y="260" text-anchor="middle" font-size="12" fill="#1E63D6">вверх-вниз</text>

  <!-- метки --><circle cx="510" cy="300" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="510" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">1</text><circle cx="330" cy="197" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="330" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">2</text><circle cx="385" cy="265" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="385" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">3</text><circle cx="412" cy="318" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="412" y="323" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">4</text><circle cx="335" cy="330" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="335" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">5</text><circle cx="140" cy="386" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="140" y="391" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">6</text><circle cx="170" cy="416" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="170" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">7</text><circle cx="200" cy="462" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="200" y="467" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">8</text>
  <!-- выноски -->
  <g font-size="14" fill="#1E293B">
    <text x="645" y="124"><tspan font-weight="700" fill="#B45309">1.</tspan> Колонна (стойка)</text>
    <text x="645" y="169"><tspan font-weight="700" fill="#B45309">2.</tspan> Шпиндельная бабка</text>
    <text x="645" y="214"><tspan font-weight="700" fill="#B45309">3.</tspan> Шпиндель</text>
    <text x="645" y="259"><tspan font-weight="700" fill="#B45309">4.</tspan> Инструмент (фреза)</text>
    <text x="645" y="304"><tspan font-weight="700" fill="#B45309">5.</tspan> Заготовка в тисках</text>
    <text x="645" y="349"><tspan font-weight="700" fill="#B45309">6.</tspan> Стол (T-пазы)</text>
    <text x="645" y="394"><tspan font-weight="700" fill="#B45309">7.</tspan> Салазки</text>
    <text x="645" y="439"><tspan font-weight="700" fill="#B45309">8.</tspan> Станина</text>
  </g>
  <rect x="630" y="465" width="210" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="642" y="487" font-size="12" fill="#334155">Цвета осей во всём конспекте:</text>
  <text x="642" y="509" font-size="14" font-weight="700" fill="#E53935">X</text>
  <text x="662" y="509" font-size="14" font-weight="700" fill="#2E7D32">Y</text>
  <text x="682" y="509" font-size="14" font-weight="700" fill="#1E63D6">Z</text>
  <text x="704" y="509" font-size="12" fill="#334155">(как в CAD/CAM)</text>
</svg>
