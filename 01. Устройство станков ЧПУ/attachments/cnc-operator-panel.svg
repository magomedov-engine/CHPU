<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="856" height="596" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Пульт оператора станка с ЧПУ (обобщённая схема)</text>

  <!-- корпус пульта -->
  <rect x="40" y="60" width="560" height="510" rx="14" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
  <!-- экран -->
  <rect x="60" y="80" width="320" height="210" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
  <text x="75" y="108" font-size="13" fill="#4ADE80" font-family="Consolas, monospace">ABS   X  -125.430</text>
  <text x="75" y="128" font-size="13" fill="#4ADE80" font-family="Consolas, monospace">      Y    48.000</text>
  <text x="75" y="148" font-size="13" fill="#4ADE80" font-family="Consolas, monospace">      Z    10.000</text>
  <text x="75" y="178" font-size="12" fill="#93C5FD" font-family="Consolas, monospace">O1001 N40 G01 X-130. F200</text>
  <text x="75" y="198" font-size="12" fill="#93C5FD" font-family="Consolas, monospace">S 3000  F 200  T03</text>
  <text x="75" y="270" font-size="12" fill="#FBBF24" font-family="Consolas, monospace">MEM  STRT  ****</text>
  <text x="220" y="310" text-anchor="middle" font-size="12" fill="#334155">① Экран: координаты, программа, режимы</text>
  <!-- клавиатура -->
  <rect x="395" y="80" width="190" height="210" rx="6" fill="#E2E8F0" stroke="#64748B"/>
  <g fill="#FFFFFF" stroke="#94A3B8">
    <rect x="405" y="92" width="34" height="26" rx="3"/><rect x="445" y="92" width="34" height="26" rx="3"/><rect x="485" y="92" width="34" height="26" rx="3"/><rect x="525" y="92" width="34" height="26" rx="3"/>
    <rect x="405" y="124" width="34" height="26" rx="3"/><rect x="445" y="124" width="34" height="26" rx="3"/><rect x="485" y="124" width="34" height="26" rx="3"/><rect x="525" y="124" width="34" height="26" rx="3"/>
    <rect x="405" y="156" width="34" height="26" rx="3"/><rect x="445" y="156" width="34" height="26" rx="3"/><rect x="485" y="156" width="34" height="26" rx="3"/><rect x="525" y="156" width="34" height="26" rx="3"/>
    <rect x="405" y="188" width="34" height="26" rx="3"/><rect x="445" y="188" width="34" height="26" rx="3"/><rect x="485" y="188" width="34" height="26" rx="3"/><rect x="525" y="188" width="34" height="26" rx="3"/>
  </g>
  <g font-size="12" font-family="Consolas, monospace" text-anchor="middle" fill="#1E293B">
    <text x="422" y="110">G</text><text x="462" y="110">X</text><text x="502" y="110">7</text><text x="542" y="110">8</text>
    <text x="422" y="142">M</text><text x="462" y="142">Y</text><text x="502" y="142">4</text><text x="542" y="142">5</text>
    <text x="422" y="174">S</text><text x="462" y="174">Z</text><text x="502" y="174">1</text><text x="542" y="174">2</text>
    <text x="422" y="206">T</text><text x="462" y="206">F</text><text x="502" y="206">0</text><text x="542" y="206">.</text>
  </g>
  <rect x="405" y="224" width="74" height="26" rx="3" fill="#FFFFFF" stroke="#94A3B8"/><text x="442" y="242" text-anchor="middle" font-size="11" fill="#1E293B">RESET</text>
  <rect x="485" y="224" width="74" height="26" rx="3" fill="#FFFFFF" stroke="#94A3B8"/><text x="522" y="242" text-anchor="middle" font-size="11" fill="#1E293B">INPUT</text>
  <text x="490" y="310" text-anchor="middle" font-size="12" fill="#334155">② Клавиатура (MDI)</text>

  <!-- переключатель режимов -->
  <circle cx="110" cy="390" r="42" fill="#475569" stroke="#1E293B" stroke-width="2"/>
  <line x1="110" y1="390" x2="110" y2="356" stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
  <g font-size="10" fill="#1E293B" text-anchor="middle">
    <text x="110" y="340">AUTO</text><text x="172" y="360">EDIT</text><text x="178" y="395">MDI</text><text x="172" y="430">JOG</text><text x="48" y="360">REF</text><text x="42" y="395">HND</text>
  </g>
  <text x="110" y="460" text-anchor="middle" font-size="12" fill="#334155">③ Режимы</text>
  <!-- корректоры -->
  <circle cx="250" cy="390" r="34" fill="#64748B" stroke="#1E293B" stroke-width="2"/>
  <line x1="250" y1="390" x2="270" y2="364" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>
  <text x="250" y="445" text-anchor="middle" font-size="12" fill="#334155">④ Корр. подачи</text>
  <text x="250" y="460" text-anchor="middle" font-size="11" fill="#334155">0–150 %</text>
  <circle cx="350" cy="390" r="34" fill="#64748B" stroke="#1E293B" stroke-width="2"/>
  <line x1="350" y1="390" x2="350" y2="358" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>
  <text x="350" y="445" text-anchor="middle" font-size="12" fill="#334155">⑤ Корр. шпинделя</text>
  <text x="350" y="460" text-anchor="middle" font-size="11" fill="#334155">50–120 %</text>
  <!-- кнопки цикла -->
  <rect x="420" y="350" width="70" height="44" rx="8" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <text x="455" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">START</text>
  <rect x="505" y="350" width="70" height="44" rx="8" fill="#FACC15" stroke="#A16207" stroke-width="2"/>
  <text x="540" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#1E293B">HOLD</text>
  <text x="455" y="412" text-anchor="middle" font-size="11" fill="#334155">⑥ Пуск цикла</text>
  <text x="540" y="412" text-anchor="middle" font-size="11" fill="#334155">⑦ Стоп подачи</text>
  <!-- аварийка -->
  <circle cx="500" cy="500" r="40" fill="#FACC15" stroke="#A16207" stroke-width="2"/>
  <circle cx="500" cy="500" r="28" fill="#DC2626" stroke="#7F1D1D" stroke-width="2"/>
  <text x="500" y="555" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">⑧ АВАРИЙНЫЙ СТОП</text>
  <!-- кнопки осей -->
  <g fill="#FFFFFF" stroke="#94A3B8">
    <rect x="70" y="490" width="40" height="30" rx="4"/><rect x="115" y="490" width="40" height="30" rx="4"/><rect x="160" y="490" width="40" height="30" rx="4"/>
    <rect x="215" y="490" width="40" height="30" rx="4"/><rect x="260" y="490" width="40" height="30" rx="4"/>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle"><text x="90" y="510" fill="#E53935">X</text><text x="135" y="510" fill="#2E7D32">Y</text><text x="180" y="510" fill="#1E63D6">Z</text><text x="235" y="510" fill="#1E293B">+</text><text x="280" y="510" fill="#1E293B">−</text></g>
  <text x="185" y="545" text-anchor="middle" font-size="12" fill="#334155">⑨ Выбор оси и направления (JOG)</text>
  <rect x="340" y="490" width="80" height="30" rx="4" fill="#FFFFFF" stroke="#94A3B8"/><text x="380" y="510" text-anchor="middle" font-size="11" fill="#1E293B">SINGLE BLOCK</text>

  <!-- маховик -->
  <rect x="640" y="80" width="190" height="300" rx="16" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <circle cx="735" cy="180" r="62" fill="#475569" stroke="#1E293B" stroke-width="3"/>
  <circle cx="735" cy="180" r="44" fill="#64748B"/>
  <circle cx="768" cy="150" r="8" fill="#1E293B"/>
  <g stroke="#F8FAFC" stroke-width="2"><line x1="735" y1="118" x2="735" y2="128"/><line x1="797" y1="180" x2="787" y2="180"/><line x1="735" y1="242" x2="735" y2="232"/><line x1="673" y1="180" x2="683" y2="180"/></g>
  <g font-size="11" fill="#1E293B" text-anchor="middle">
    <rect x="660" y="270" width="70" height="24" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="695" y="286">ось X/Y/Z</text>
    <rect x="740" y="270" width="70" height="24" rx="4" fill="#FFFFFF" stroke="#B45309"/><text x="775" y="286">×1 ×10 ×100</text>
  </g>
  <text x="735" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">⑩ Электронный маховик</text>
  <text x="735" y="343" text-anchor="middle" font-size="12" fill="#334155">(МПГ, «пульт на шнуре»)</text>
  <text x="735" y="361" text-anchor="middle" font-size="11" fill="#334155">×1 = 0,001 мм на щелчок</text>

  <rect x="640" y="400" width="190" height="170" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="655" y="425" font-size="13" font-weight="700" fill="#1E293B">Цвета кнопок</text>
  <rect x="655" y="440" width="18" height="18" rx="3" fill="#22C55E"/><text x="682" y="454" font-size="12" fill="#334155">зелёный — пуск</text>
  <rect x="655" y="468" width="18" height="18" rx="3" fill="#FACC15"/><text x="682" y="482" font-size="12" fill="#334155">жёлтый — пауза</text>
  <rect x="655" y="496" width="18" height="18" rx="9" fill="#DC2626"/><text x="682" y="510" font-size="12" fill="#334155">красный — авария</text>
  <text x="655" y="540" font-size="11" fill="#334155">Названия зависят от стойки,</text>
  <text x="655" y="556" font-size="11" fill="#334155">но набор функций везде один.</text>
</svg>
