<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="856" height="486" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Калибры, шаблоны и концевые меры</text>
  <g fill="#FFFFFF" stroke="#CBD5E1">
    <rect x="25" y="58" width="195" height="205" rx="10"/><rect x="230" y="58" width="195" height="205" rx="10"/><rect x="435" y="58" width="195" height="205" rx="10"/><rect x="640" y="58" width="195" height="205" rx="10"/>
    <rect x="25" y="273" width="195" height="205" rx="10"/><rect x="230" y="273" width="195" height="205" rx="10"/><rect x="435" y="273" width="195" height="205" rx="10"/><rect x="640" y="273" width="195" height="205" rx="10"/>
  </g>

  <!-- 1 пробка -->
  <rect x="45" y="128" width="50" height="34" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <rect x="95" y="133" width="60" height="24" rx="4" fill="#94A3B8" stroke="#475569"/>
  <g stroke="#64748B"><line x1="105" y1="133" x2="105" y2="157"/><line x1="115" y1="133" x2="115" y2="157"/><line x1="125" y1="133" x2="125" y2="157"/><line x1="135" y1="133" x2="135" y2="157"/><line x1="145" y1="133" x2="145" y2="157"/></g>
  <rect x="155" y="128" width="30" height="34" rx="3" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <rect x="155" y="128" width="8" height="34" fill="#DC2626"/>
  <text x="70" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#15803D">ПР</text>
  <text x="170" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">НЕ</text>
  <text x="122" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Калибр-пробка</text>
  <text x="122" y="235" text-anchor="middle" font-size="11" fill="#475569">отверстие: ПР входит,</text>
  <text x="122" y="250" text-anchor="middle" font-size="11" fill="#475569">НЕ — не входит</text>

  <!-- 2 скоба -->
  <path d="M260,80 L400,80 L400,195 L370,195 L370,110 L290,110 L290,195 L260,195 Z" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <rect x="290" y="168" width="12" height="27" fill="#E2E8F0" stroke="#475569"/><rect x="358" y="168" width="12" height="27" fill="#E2E8F0" stroke="#475569"/>
  <rect x="290" y="122" width="18" height="27" fill="#FCA5A5" stroke="#DC2626"/><rect x="352" y="122" width="18" height="27" fill="#FCA5A5" stroke="#DC2626"/>
  <text x="330" y="187" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">ПР</text>
  <text x="330" y="141" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">НЕ</text>
  <text x="327" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Калибр-скоба</text>
  <text x="327" y="235" text-anchor="middle" font-size="11" fill="#475569">вал: ПР проходит,</text>
  <text x="327" y="250" text-anchor="middle" font-size="11" fill="#475569">НЕ — не проходит</text>

  <!-- 3 резьбовое кольцо -->
  <circle cx="532" cy="138" r="52" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="532" cy="138" r="52" fill="none" stroke="#94A3B8" stroke-width="5" stroke-dasharray="3 4"/>
  <polygon points="560,138 556.1,145.5 550.4,154.9 541.5,157.4 532,162 522.5,157.4 513.6,154.9 507.9,145.5 504,138 507.9,130.5 513.6,121.1 522.5,118.6 532,114 541.5,118.6 550.4,121.1 556.1,130.5" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  <text x="532" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#15803D">ПР</text>
  <text x="532" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Резьбовое кольцо</text>
  <text x="532" y="235" text-anchor="middle" font-size="11" fill="#475569">наружная резьба (для внутренней</text>
  <text x="532" y="250" text-anchor="middle" font-size="11" fill="#475569">— резьбовая пробка ПР/НЕ)</text>

  <!-- 4 резьбомер -->
  <g transform="translate(675,185)">
    <rect x="0" y="-8" width="110" height="16" rx="3" fill="#E2E8F0" stroke="#475569" transform="rotate(-65)"/>
    <rect x="0" y="-8" width="110" height="16" rx="3" fill="#E2E8F0" stroke="#475569" transform="rotate(-48)"/>
    <rect x="0" y="-8" width="110" height="16" rx="3" fill="#E2E8F0" stroke="#475569" transform="rotate(-31)"/>
    <g transform="rotate(-14)">
      <rect x="0" y="-8" width="110" height="16" rx="3" fill="#E2E8F0" stroke="#475569"/>
      <polyline points="30,-8 35,-14 40,-8 45,-14 50,-8 55,-14 60,-8 65,-14 70,-8 75,-14 80,-8 85,-14 90,-8 95,-14 100,-8" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="#475569"/>
  </g>
  <text x="737" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Резьбомер</text>
  <text x="737" y="235" text-anchor="middle" font-size="11" fill="#475569">определить шаг резьбы</text>
  <text x="737" y="250" text-anchor="middle" font-size="11" fill="#475569">(М60 — метр., Д55 — дюйм.)</text>

  <!-- 5 радиусные -->
  <path d="M50,300 L150,300 L150,322 A16 16 0 0 0 150,354 L150,376 L50,376 Z" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <path d="M60,390 L160,390 A18 18 0 0 1 160,426 L60,426 Z" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <text x="100" y="342" font-size="12" fill="#1E293B">R16</text>
  <text x="95" y="413" font-size="12" fill="#1E293B">R18</text>
  <text x="185" y="345" font-size="10" fill="#475569">для</text>
  <text x="185" y="357" font-size="10" fill="#475569">выпуклых</text>
  <text x="185" y="410" font-size="10" fill="#475569">для</text>
  <text x="185" y="422" font-size="10" fill="#475569">вогнутых</text>
  <text x="122" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Радиусные шаблоны</text>
  <text x="122" y="468" text-anchor="middle" font-size="11" fill="#475569">радиус проверяют на просвет</text>

  <!-- 6 щупы -->
  <g transform="translate(260,410)">
    <rect x="0" y="-4" width="140" height="8" rx="2" fill="#E2E8F0" stroke="#475569" transform="rotate(-40)"/>
    <rect x="0" y="-3" width="140" height="6" rx="2" fill="#E2E8F0" stroke="#475569" transform="rotate(-28)"/>
    <rect x="0" y="-2.5" width="140" height="5" rx="2" fill="#E2E8F0" stroke="#475569" transform="rotate(-16)"/>
    <rect x="0" y="-2" width="140" height="4" rx="2" fill="#E2E8F0" stroke="#475569" transform="rotate(-4)"/>
    <circle r="7" fill="#475569"/>
  </g>
  <text x="365" y="318" font-size="10" fill="#1E293B">1,0</text>
  <text x="392" y="355" font-size="10" fill="#1E293B">0,5</text>
  <text x="402" y="385" font-size="10" fill="#1E293B">0,1</text>
  <text x="402" y="410" font-size="10" fill="#1E293B">0,05</text>
  <text x="327" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Набор щупов</text>
  <text x="327" y="468" text-anchor="middle" font-size="11" fill="#475569">зазоры 0,02–1 мм</text>

  <!-- 7 концевые меры -->
  <rect x="460" y="320" width="40" height="100" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <rect x="510" y="380" width="40" height="40" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <rect x="560" y="404" width="40" height="16" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="374" text-anchor="middle" font-size="12" fill="#1E293B">50</text>
  <text x="530" y="404" text-anchor="middle" font-size="12" fill="#1E293B">20</text>
  <text x="580" y="398" text-anchor="middle" font-size="11" fill="#1E293B">1,005</text>
  <line x1="455" y1="420" x2="610" y2="420" stroke="#64748B" stroke-width="2"/>
  <text x="532" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Концевые меры (плитки)</text>
  <text x="532" y="468" text-anchor="middle" font-size="11" fill="#475569">эталон длины; блок = сумма плиток</text>

  <!-- 8 угольник -->
  <path d="M680,300 L700,300 L700,410 L790,410 L790,430 L680,430 Z" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <rect x="712" y="330" width="70" height="78" fill="#FDE68A" stroke="#B45309"/>
  <polygon points="700,330 712,330 712,408 700,408" fill="#FEF9C3"/>
  <line x1="704" y1="335" x2="710" y2="400" stroke="#F59E0B" stroke-width="2"/>
  <text x="745" y="322" font-size="10" fill="#B45309">просвет</text>
  <text x="737" y="450" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Поверочный угольник</text>
  <text x="737" y="468" text-anchor="middle" font-size="11" fill="#475569">перпендикулярность на просвет</text>
</svg>
