<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="856" height="426" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Микрометр гладкий МК: устройство</text>

  <!-- скоба -->
  <path d="M110,120 L150,120 L150,240 Q150,280 190,280 L290,280 Q330,280 330,240 L330,120 L370,120 L370,250 Q370,320 300,320 L180,320 Q110,320 110,250 Z" fill="#64748B" stroke="#334155" stroke-width="2"/>
  <rect x="170" y="290" width="140" height="22" rx="8" fill="#93C5FD" stroke="#1E63D6"/>
  <!-- пятка -->
  <rect x="150" y="141" width="40" height="18" fill="#E2E8F0" stroke="#64748B"/>
  <!-- деталь -->
  <rect x="190" y="126" width="36" height="48" rx="3" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <!-- микровинт -->
  <rect x="226" y="141" width="144" height="18" fill="#E2E8F0" stroke="#64748B"/>
  <!-- стопор -->
  <rect x="338" y="100" width="26" height="16" rx="3" fill="#475569"/>
  <line x1="351" y1="116" x2="351" y2="122" stroke="#475569" stroke-width="4"/>
  <!-- стебель -->
  <rect x="370" y="136" width="130" height="28" fill="#CBD5E1" stroke="#64748B"/>
  <line x1="374" y1="150" x2="490" y2="150" stroke="#1E293B" stroke-width="1"/>
  <g stroke="#1E293B" stroke-width="1">
    <line x1="380" y1="150" x2="380" y2="140"/><line x1="389" y1="150" x2="389" y2="144"/><line x1="398" y1="150" x2="398" y2="144"/><line x1="407" y1="150" x2="407" y2="144"/><line x1="416" y1="150" x2="416" y2="144"/><line x1="425" y1="150" x2="425" y2="140"/><line x1="434" y1="150" x2="434" y2="144"/><line x1="443" y1="150" x2="443" y2="144"/><line x1="452" y1="150" x2="452" y2="144"/><line x1="461" y1="150" x2="461" y2="144"/><line x1="470" y1="150" x2="470" y2="140"/>
  </g>
  <g stroke="#1E63D6" stroke-width="1">
    <line x1="384.5" y1="150" x2="384.5" y2="156"/><line x1="393.5" y1="150" x2="393.5" y2="156"/><line x1="402.5" y1="150" x2="402.5" y2="156"/><line x1="411.5" y1="150" x2="411.5" y2="156"/><line x1="420.5" y1="150" x2="420.5" y2="156"/><line x1="429.5" y1="150" x2="429.5" y2="156"/><line x1="438.5" y1="150" x2="438.5" y2="156"/><line x1="447.5" y1="150" x2="447.5" y2="156"/><line x1="456.5" y1="150" x2="456.5" y2="156"/><line x1="465.5" y1="150" x2="465.5" y2="156"/><line x1="474.5" y1="150" x2="474.5" y2="156"/>
  </g>
  <!-- барабан -->
  <polygon points="480,138 492,126 610,126 610,174 492,174 480,162" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
  <g stroke="#1E293B" stroke-width="0.9">
    <line x1="492" y1="130" x2="500" y2="130"/><line x1="492" y1="134" x2="500" y2="134"/><line x1="492" y1="138" x2="500" y2="138"/><line x1="492" y1="142" x2="500" y2="142"/><line x1="492" y1="146" x2="504" y2="146"/><line x1="492" y1="150" x2="500" y2="150"/><line x1="492" y1="154" x2="500" y2="154"/><line x1="492" y1="158" x2="500" y2="158"/><line x1="492" y1="162" x2="500" y2="162"/><line x1="492" y1="166" x2="504" y2="166"/><line x1="492" y1="170" x2="500" y2="170"/>
  </g>
  <!-- трещотка -->
  <rect x="610" y="136" width="50" height="28" rx="3" fill="#64748B" stroke="#334155"/>
  <g stroke="#94A3B8" stroke-width="1.5"><line x1="618" y1="138" x2="618" y2="162"/><line x1="626" y1="138" x2="626" y2="162"/><line x1="634" y1="138" x2="634" y2="162"/><line x1="642" y1="138" x2="642" y2="162"/><line x1="650" y1="138" x2="650" y2="162"/></g>

  <!-- метки -->
  <g font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">
    <circle cx="350" cy="280" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="350" y="284">1</text>
    <circle cx="170" cy="122" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="170" y="126">2</text>
    <circle cx="290" cy="122" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="290" y="126">3</text>
    <circle cx="380" cy="100" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="380" y="104">4</text>
    <circle cx="430" cy="185" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="430" y="189">5</text>
    <circle cx="550" cy="105" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="550" y="109">6</text>
    <circle cx="635" cy="115" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="635" y="119">7</text>
    <circle cx="240" cy="345" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="240" y="349">8</text>
  </g>
  <line x1="240" y1="334" x2="240" y2="314" stroke="#F59E0B" stroke-width="1.5"/>

  <rect x="680" y="70" width="160" height="270" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <g font-size="12" fill="#1E293B">
    <text x="692" y="96"><tspan font-weight="700" fill="#B45309">1</tspan> Скоба</text>
    <text x="692" y="124"><tspan font-weight="700" fill="#B45309">2</tspan> Пятка</text>
    <text x="692" y="152"><tspan font-weight="700" fill="#B45309">3</tspan> Микровинт</text>
    <text x="692" y="180"><tspan font-weight="700" fill="#B45309">4</tspan> Стопор</text>
    <text x="692" y="208"><tspan font-weight="700" fill="#B45309">5</tspan> Стебель со шкалой</text>
    <text x="692" y="236"><tspan font-weight="700" fill="#B45309">6</tspan> Барабан (50 дел.)</text>
    <text x="692" y="264"><tspan font-weight="700" fill="#B45309">7</tspan> Трещотка</text>
    <text x="692" y="292"><tspan font-weight="700" fill="#B45309">8</tspan> Теплоизоляционные</text>
    <text x="708" y="308">накладки</text>
  </g>
  <rect x="25" y="355" width="810" height="60" rx="10" fill="#FEF3C7"/>
  <text x="45" y="380" font-size="13" fill="#92400E"><tspan font-weight="700">Шаг микровинта 0,5 мм:</tspan> один оборот барабана = 0,5 мм; одно деление барабана = 0,5 / 50 = <tspan font-weight="700">0,01 мм</tspan>.</text>
  <text x="45" y="401" font-size="13" fill="#92400E">Верхние риски стебля — целые мм, нижние (синие) — половинки. Вращать только за <tspan font-weight="700">трещотку</tspan>!</text>
</svg>
