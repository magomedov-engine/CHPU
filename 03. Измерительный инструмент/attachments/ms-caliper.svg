<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="t1" width="6" height="16" patternUnits="userSpaceOnUse"><line x1="0.5" y1="0" x2="0.5" y2="7" stroke="#1E293B" stroke-width="0.8"/></pattern>
    <pattern id="t5" width="30" height="16" patternUnits="userSpaceOnUse"><line x1="0.5" y1="0" x2="0.5" y2="13" stroke="#1E293B" stroke-width="1.2"/></pattern>
  </defs>
  <rect x="2" y="2" width="856" height="466" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1E293B">Штангенциркуль ШЦ-I: устройство</text>

  <!-- штанга -->
  <rect x="100" y="150" width="710" height="40" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <rect x="160" y="151" width="640" height="16" fill="url(#t1)"/>
  <rect x="160" y="151" width="640" height="16" fill="url(#t5)"/>
  <!-- глубиномер -->
  <rect x="810" y="167" width="36" height="6" fill="#94A3B8" stroke="#64748B"/>
  <!-- неподвижная часть -->
  <rect x="80" y="140" width="70" height="60" rx="4" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <polygon points="100,200 150,200 150,340 142,348 100,262" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <polygon points="130,140 150,140 150,90 140,80 130,94" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <!-- рамка -->
  <polygon points="230,202 280,202 280,262 238,348 230,340" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <polygon points="230,138 250,138 250,94 240,80 230,90" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <rect x="230" y="138" width="110" height="64" rx="4" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
  <rect x="238" y="168" width="94" height="22" fill="#FEF3C7" stroke="#B45309"/>
  <g stroke="#1E293B" stroke-width="0.8">
    <line x1="241" y1="168" x2="241" y2="180"/><line x1="250" y1="168" x2="250" y2="175"/><line x1="259" y1="168" x2="259" y2="175"/><line x1="268" y1="168" x2="268" y2="175"/><line x1="277" y1="168" x2="277" y2="175"/><line x1="286" y1="168" x2="286" y2="180"/><line x1="295" y1="168" x2="295" y2="175"/><line x1="304" y1="168" x2="304" y2="175"/><line x1="313" y1="168" x2="313" y2="175"/><line x1="322" y1="168" x2="322" y2="175"/><line x1="331" y1="168" x2="331" y2="180"/>
  </g>
  <!-- стопорный винт -->
  <rect x="301" y="122" width="14" height="16" fill="#475569"/>
  <circle cx="308" cy="118" r="9" fill="#64748B" stroke="#1E293B"/>
  <!-- деталь -->
  <rect x="150" y="250" width="80" height="70" rx="4" fill="#FDE68A" stroke="#B45309" stroke-width="1.5"/>
  <text x="190" y="290" text-anchor="middle" font-size="12" fill="#92400E">деталь</text>

  <!-- метки -->
  <g font-size="12" font-weight="700" fill="#1E293B" text-anchor="middle">
    <circle cx="620" cy="178" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="620" y="182">1</text>
    <circle cx="352" cy="214" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="352" y="218">2</text>
    <circle cx="285" cy="153" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="285" y="157">3</text>
    <circle cx="190" cy="360" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="190" y="364">4</text>
    <circle cx="190" cy="100" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="190" y="104">5</text>
    <circle cx="332" cy="112" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="332" y="116">6</text>
    <circle cx="828" cy="148" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/><text x="828" y="152">7</text>
  </g>

  <text x="430" y="235" font-size="13" fill="#1E293B">Шкала штанги — целые миллиметры.</text>
  <text x="430" y="255" font-size="13" fill="#1E293B">Нониус на рамке — доли миллиметра (0,1 или 0,05).</text>
  <text x="430" y="280" font-size="13" fill="#1E293B">Губки 4 — наружные размеры (валы, толщины).</text>
  <text x="430" y="300" font-size="13" fill="#1E293B">Губки 5 — внутренние (отверстия, пазы).</text>
  <text x="430" y="320" font-size="13" fill="#1E293B">Линейка 7 — глубина (выдвигается вместе с рамкой).</text>

  <rect x="25" y="385" width="810" height="70" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <g font-size="13" fill="#1E293B">
    <text x="45" y="410"><tspan font-weight="700" fill="#B45309">1</tspan> Штанга со шкалой</text>
    <text x="45" y="435"><tspan font-weight="700" fill="#B45309">2</tspan> Рамка (подвижная)</text>
    <text x="250" y="410"><tspan font-weight="700" fill="#B45309">3</tspan> Нониус</text>
    <text x="250" y="435"><tspan font-weight="700" fill="#B45309">4</tspan> Губки для наружных измерений</text>
    <text x="520" y="410"><tspan font-weight="700" fill="#B45309">5</tspan> Губки для внутренних измерений</text>
    <text x="520" y="435"><tspan font-weight="700" fill="#B45309">6</tspan> Стопорный винт   <tspan font-weight="700" fill="#B45309">7</tspan> Глубиномер</text>
  </g>
</svg>
